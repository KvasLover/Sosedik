<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Уведомления - Соседик</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Локальные стили для страницы уведомлений */
    #notifications-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .notification-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 20px;
      margin-bottom: 0;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.2s;
      gap: 12px;
    }

    .notification-item:last-child {
      border-bottom: none;
    }

    .notification-item.unread {
      background-color: #f8f9fa;
      border-left: 3px solid #667eea;
    }

    .notification-content {
      flex: 1;
      width: 100%;
      font-size: 0.9rem;
      color: #212529;
      line-height: 1.4;
    }

    .notification-content small {
      display: block;
      font-size: 0.75rem;
      color: #6c757d;
      margin-top: 8px;
    }

    .notification-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .mark-read-link {
      font-size: 0.85rem;
      color: #6c757d;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .mark-read-link:hover {
      color: #667eea;
      text-decoration: underline;
    }

    .delete-icon {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
    }

    .delete-icon svg {
      width: 16px;
      height: 16px;
      stroke: #9ca3af;
      stroke-width: 2;
      fill: none;
      transition: stroke 0.2s;
    }

    .delete-icon:hover svg {
      stroke: #ef4444;
    }

    .no-notifications {
      text-align: center;
      color: #6c757d;
      padding: 32px;
    }
  </style>
</head>

<body>
  <div id="header-root"></div>
  <main>
    <h1>Уведомления</h1>
    <div style="display: flex; gap: 12px; margin-bottom: 20px; justify-content: flex-end;">
      <button id="mark-all-read-page" class="btn-action btn-action-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="margin-right: 6px; display: inline;">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Прочитанные
      </button>
      <button id="clear-all-page" class="btn-action btn-action-danger">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="margin-right: 6px; display: inline;">
          <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Очистить
      </button>
    </div>
    <div id="auth-check" class="hidden">
      <p>Вы не авторизованы. <a href="/login.html">Войти</a></p>
    </div>
    <div id="notifications-container">
      <div class="loading">Загрузка уведомлений...</div>
    </div>
  </main>
  <script src="js/header_new.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        document.getElementById('auth-check').classList.remove('hidden');
        document.getElementById('notifications-container').innerHTML = '';
        return;
      }
      await refreshNotifications();

      // Кнопки массовых действий
      document.getElementById('mark-all-read-page').addEventListener('click', async () => {
        const token = localStorage.getItem('sosedik_token');
        await fetch('/api/notifications/read-all', {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        await refreshNotifications();
      });

      document.getElementById('clear-all-page').addEventListener('click', async () => {
        const token = localStorage.getItem('sosedik_token');
        await fetch('/api/notifications/clear', {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        await refreshNotifications();
      });
    });

    async function refreshNotifications() {
      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch('/api/notifications', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Ошибка загрузки');
        const data = await response.json();
        renderNotifications(data.notifications || []);
      } catch (error) {
        document.getElementById('notifications-container').innerHTML = '<p class="error">Ошибка загрузки уведомлений: ' + error.message + '</p>';
      }
    }

    function renderNotifications(notifications) {
      const container = document.getElementById('notifications-container');
      if (!notifications || notifications.length === 0) {
        container.innerHTML = '<p class="no-notifications">У вас нет уведомлений</p>';
        return;
      }

      const html = notifications.map(notification => `
        <div class="notification-item ${notification.is_read ? 'read' : 'unread'}"
          data-id="${notification.id}"  
          data-type="${notification.type}"
          data-related-type="${notification.related_type || ''}"
          data-related-id="${notification.related_id || ''}">
          <div class="notification-content">
            ${escapeHtml(notification.message)}
            <small>${new Date(notification.created_at).toLocaleString()}</small>
          </div>
          <div class="notification-actions">
            ${!notification.is_read ? `<span class="mark-read-link" data-id="${notification.id}">Отметить как прочитанное</span>` : ''}
            <button class="delete-icon" data-id="${notification.id}" title="Удалить уведомление">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      `).join('');
      container.innerHTML = html;

      // Обработчик клика по уведомлению (переход)
      document.querySelectorAll('.notification-item').forEach(card => {
        card.addEventListener('click', async (e) => {
          // Если клик был по кнопке удаления – не обрабатываем
          if (e.target.closest('.delete-notification') || e.target.closest('.delete-icon') || e.target.closest('.delete-notif-btn')) return;
          const id = card.dataset.id;
          const type = card.dataset.type;
          const relatedId = card.dataset.relatedId;
          // Отметить как прочитанное (если ещё не прочитано)
          if (!card.classList.contains('read')) {
            await markAsRead(id);
            card.classList.remove('unread');
            card.classList.add('read');
            await new Promise(resolve => setTimeout(resolve, 100));
          }
          // Переход
          if (type === 'new_message' || type === 'request_completed') {
            window.location.href = relatedId ? `/request-chat.html?requestId=${relatedId}` : '/profile.html';
          } else if (type === 'new_request') {
            window.location.href = '/profile.html?tab=incoming';
          } else if (['request_accepted', 'request_started', 'request_pending_completion'].includes(type)) {
            window.location.href = '/profile.html?tab=active';
          } else if (type === 'request_rejected') {
            window.location.href = '/profile.html?tab=outgoing';
          } else {
            window.location.href = '/profile.html';
          }
        });
      });

      // Кнопка "Прочитано" (ссылка)
      document.querySelectorAll('.mark-read-link').forEach(link => {
        link.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = link.dataset.id;
          await markAsRead(id);
          await refreshNotifications();
        });
      });
      // Кнопка "Удалить" (крестик)
      document.querySelectorAll('.delete-icon').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          await deleteNotification(id);
          await refreshNotifications();
        });
      });
    }

    async function markAsRead(id) {
      const token = localStorage.getItem('sosedik_token');
      await fetch(`/api/notifications/${id}/read`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}` }
      });
    }

    async function deleteNotification(id) {
      const token = localStorage.getItem('sosedik_token');
      await fetch(`/api/notifications/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function (m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    window.addEventListener('notifications-updated', () => {
      console.log('Обновляем уведомления по событию из попапа');
      refreshNotifications();
    });
  </script>
</body>

</html>
