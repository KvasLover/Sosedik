<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Объявления - Соседик</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Header -->
  <div id="header-root"></div>

  <!-- Main -->
  <main>
    <h1>Объявления</h1>

    <div id="auth-check" class="hidden">
      <p>Вы не авторизованы. <a href="/login.html">Войти</a></p>
    </div>

    <div id="ads-content">
      <!-- Button to open create ad form -->
      <div class="ads-create-container">
        <button onclick="toggleCreateForm()" class="ads-create-btn">+ Создать объявление</button>
      </div>

      <!-- Form to create new ad (hidden by default) -->
      <div id="create-form" class="form-container hidden">
        <div class="ads-form-header">
          <h2>Создать объявление</h2>
          <button onclick="toggleCreateForm()" class="ads-close-btn">✕</button>
        </div>
        <div class="form-group">
          <label for="ad-category">Категория:</label>
          <select id="ad-category" required>
            <option value="">Выберите категорию</option>
            <option value="продажа">Продажа</option>
            <option value="покупка">Покупка</option>
            <option value="услуга">Услуга</option>
            <option value="help">Помощь</option>
            <option value="other">Прочее</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ad-title">Название:</label>
          <input type="text" id="ad-title" placeholder="Название объявления" required>
        </div>
        <div class="form-group">
          <label for="ad-description">Описание:</label>
          <textarea id="ad-description" placeholder="Описание объявления" rows="4" required></textarea>
        </div>
        <div class="form-group">
          <label for="ad-price">Цена (опционально):</label>
          <input type="number" id="ad-price" placeholder="Цена в рублях">
        </div>
        <div class="form-group">
          <label for="ad-contact">Контактная информация:</label>
          <input type="text" id="ad-contact" placeholder="Телефон или email">
        </div>
        <button onclick="createAd()">Создать</button>
        <div id="create-message" class="result hidden"></div>
      </div>

      <!-- Search and filters -->
      <div class="form-container ads-filters">
        <h2>Поиск и фильтры</h2>
        <div class="ads-filters-grid">
          <div class="form-group">
            <label for="search-query">Поиск:</label>
            <input type="text" id="search-query" placeholder="Введите поисковый запрос">
          </div>
          <div class="form-group">
            <label for="filter-category">Категория:</label>
            <select id="filter-category">
              <option value="">Все категории</option>
              <option value="продажа">Продажа</option>
              <option value="покупка">Покупка</option>
              <option value="услуга">Услуга</option>
              <option value="help">Помощь</option>
              <option value="other">Прочее</option>
            </select>
          </div>
        </div>
        <button onclick="applyFilters()">Применить фильтры</button>
      </div>

      <!-- My ads filter -->
      <div class="ads-filters-container">
        <label for="filter-my-ads">
          <input type="checkbox" id="filter-my-ads" onchange="applyFilters()">
          Только мои объявления
        </label>
      </div>

      <!-- Ads List -->
      <div class="form-container">
        <h2>Объявления</h2>
        <div class="ads-container" id="ads-list">
          <!-- Ads будут загружены сюда -->
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Соседик. Все права защищены.</p>
  </footer>

  <script src="js/header.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allAds = []; // Store all ads for filtering
    let currentUserId = null; // Store current user ID

    // Get user ID from JWT token
    function getUserIdFromToken() {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return null;
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.id;
      } catch (e) {
        return null;
      }
    }

    // Проверить авторизацию и загрузить объявления при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        document.getElementById('auth-check').classList.remove('hidden');
        document.getElementById('ads-content').classList.add('hidden');
      } else {
        // Get current user ID and load ads
        getCurrentUserId().then(() => loadAds());
      }
    });

    // Обновить объявления при возврате на страницу (навигация назад/вперёд)
    window.addEventListener('pageshow', () => {
      const token = localStorage.getItem('sosedik_token');
      if (token && currentUserId) {
        loadAds();
      }
    });

    // Get current user ID
    async function getCurrentUserId() {
      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch('/api/users/me', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        if (response.ok) {
          const user = await response.json();
          currentUserId = user.id;
        }
      } catch (error) {
        console.error('Ошибка получения профиля:', error.message);
      }
    }

    // Открыть/закрыть форму создания объявления
    function toggleCreateForm() {
      const form = document.getElementById('create-form');
      form.classList.toggle('hidden');
    }

    // Загрузить объявления
    async function loadAds() {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return;

      try {
        const response = await fetch('/api/ads', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          allAds = await response.json();
          displayAds(allAds);
        }
      } catch (error) {
        alert('Ошибка загрузки объявлений: ' + error.message);
      }
    }

    // Display ads with optional filtering
    function displayAds(ads) {
      const adsList = document.getElementById('ads-list');
      adsList.innerHTML = '';

      if (ads.length === 0) {
        adsList.innerHTML = '<p>Нет объявлений</p>';
        return;
      }

      const currentUserId = getUserIdFromToken();

      ads.forEach(ad => {
        const adDiv = document.createElement('div');
        adDiv.className = 'ad-item';
        adDiv.style.cursor = 'pointer';
        adDiv.onclick = () => window.location.href = `/ad-details.html?id=${ad.id}`;

        let deleteButton = '';
        if (currentUserId && parseInt(ad.user_id) === parseInt(currentUserId)) {
          deleteButton = `<button onclick="event.stopPropagation(); deleteAd(${ad.id})" class="ads-delete-btn">Удалить</button>`;
        }

        let favoriteButton = '';
        if (currentUserId && parseInt(ad.user_id) !== parseInt(currentUserId)) {
          favoriteButton = `<button onclick="event.stopPropagation(); toggleFavorite('ad', ${ad.id}, this)" class="ads-favorite-btn">♡</button>`;
        }

        let acceptButton = '';
        if (currentUserId && parseInt(ad.user_id) !== parseInt(currentUserId)) {
          if (!ad.accepted_by) {
            acceptButton = `<button onclick="event.stopPropagation(); requestAd(${ad.id}, this)" class="ads-request-btn">Отправить запрос</button>`;
          } else if (parseInt(ad.accepted_by) === parseInt(currentUserId)) {
            acceptButton = `<span class="ads-accepted">✓ Принято вами</span>`;
          } else {
            acceptButton = `<span class="ads-taken">Принято другим пользователем</span>`;
          }
        }

        const isOwner = currentUserId && ad.user_id === currentUserId;
        const titleWithBadge = isOwner ? `${ad.title} <span class="ads-owner-badge">(Ваше)</span>` : ad.title;

        adDiv.innerHTML = '<h3>' + titleWithBadge + '</h3>' +
          '<p><strong>Категория:</strong> ' + ad.category + '</p>' +
          '<p>' + ad.description + '</p>' +
          (ad.price ? '<p><strong>Цена:</strong> ' + ad.price + ' руб.</p>' : '') +
          (ad.contact ? '<p><strong>Контакт:</strong> ' + ad.contact + '</p>' : '') +
          '<p><small>Создано: ' + new Date(ad.created_at).toLocaleDateString() + '</small></p>' +
          (isOwner && ad.accepted_by ? '<p class="ads-accepted-by">Принято пользователем ' + (ad.acceptor_name || ('#' + ad.accepted_by)) + '</p>' : '') +
          acceptButton +
          deleteButton;

        // Добавить кнопку избранного после создания innerHTML
        if (favoriteButton) {
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = favoriteButton;
          const favBtn = tempDiv.firstElementChild;
          adDiv.appendChild(favBtn);
          
          // Проверить статус избранного и обновить кнопку
          checkFavoriteStatus('ad', ad.id).then(isFavorite => {
            if (isFavorite) {
              favBtn.classList.add('active');
              favBtn.innerHTML = '♥';
            }
          });
        }

        adsList.appendChild(adDiv);
      });
    }

    // Применить фильтры
    function applyFilters() {
      const searchQuery = document.getElementById('search-query').value.toLowerCase();
      const filterCategory = document.getElementById('filter-category').value;
      const filterMyAds = document.getElementById('filter-my-ads').checked;

      let filteredAds = allAds;

      // Filter by category
      if (filterCategory) {
        filteredAds = filteredAds.filter(ad => ad.category === filterCategory);
      }

      // Filter by current user only
      if (filterMyAds) {
        const userId = currentUserId || getUserIdFromToken();
        if (userId) {
          filteredAds = filteredAds.filter(ad => ad.user_id === userId);
        } else {
          console.warn('Unable to get user ID for filtering');
          // If no user ID, don't filter (show all ads)
        }
      }

      // Filter by search query
      if (searchQuery) {
        filteredAds = filteredAds.filter(ad => 
          ad.title.toLowerCase().includes(searchQuery) || 
          ad.description.toLowerCase().includes(searchQuery)
        );
      }

      displayAds(filteredAds);
    }

    // Создать объявление
    async function createAd() {
      const token = localStorage.getItem('sosedik_token');
      const category = document.getElementById('ad-category').value;
      const title = document.getElementById('ad-title').value;
      const description = document.getElementById('ad-description').value;
      const price = document.getElementById('ad-price').value;
      const contact = document.getElementById('ad-contact').value;

      if (!category || !title || !description) {
        alert('Заполните все обязательные поля');
        return;
      }

      try {
        const response = await fetch('/api/ads', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ 
            category, 
            title, 
            description,
            price: price || null,
            contact: contact || null
          })
        });

        const data = await response.json();

        if (response.ok) {
          showCreateMessage('Объявление создано успешно!', true);
          document.getElementById('ad-category').value = '';
          document.getElementById('ad-title').value = '';
          document.getElementById('ad-description').value = '';
          document.getElementById('ad-price').value = '';
          document.getElementById('ad-contact').value = '';
          toggleCreateForm(); // Закрыть форму
          loadAds();
        } else {
          showCreateMessage(data.message || 'Ошибка создания объявления', false);
        }
      } catch (error) {
        showCreateMessage('Ошибка: ' + error.message, false);
      }
    }

    function showCreateMessage(message, isSuccess) {
      const messageDiv = document.getElementById('create-message');
      messageDiv.textContent = message;
      messageDiv.className = 'result ' + (isSuccess ? 'success' : 'error');
      messageDiv.classList.remove('hidden');
      setTimeout(() => messageDiv.classList.add('hidden'), 5000);
    }

    // Удалить объявление
    async function deleteAd(adId) {
      if (!confirm('Вы уверены, что хотите удалить это объявление?')) {
        return;
      }

      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch(`/api/ads/${adId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          alert('Объявление удалено');
          loadAds();
        } else {
          const data = await response.json();
          alert('Ошибка: ' + (data.message || 'Не удалось удалить объявление'));
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Проверить статус избранного
    async function checkFavoriteStatus(itemType, itemId) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return false;

      try {
        const response = await fetch(`/api/favorites/${itemType}/${itemId}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        if (response.ok) {
          const data = await response.json();
          return data.isFavorite;
        }
        
        return false;
      } catch (error) {
        console.error('Error checking favorite status:', error);
        return false;
      }
    }

    // Добавить/удалить из избранного
    async function toggleFavorite(itemType, itemId, buttonElement) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      const isFavorite = buttonElement.classList.contains('active');

      try {
        const method = isFavorite ? 'DELETE' : 'POST';
        const url = isFavorite ? `/api/favorites/${itemType}/${itemId}` : '/api/favorites';
        const response = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: isFavorite ? undefined : JSON.stringify({ itemType, itemId })
        });

        if (response.ok) {
          buttonElement.classList.toggle('active');
          buttonElement.innerHTML = isFavorite ? '♡' : '♥';
        } else {
          let errorMessage = 'Не удалось обновить избранное';
          try {
            const data = await response.json();
            errorMessage = data.message || errorMessage;
          } catch (e) {
            // If response is not JSON, use status text
            errorMessage = `Ошибка ${response.status}: ${response.statusText}`;
          }
          alert('Ошибка: ' + errorMessage);
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Отправить запрос на принятие объявления
    async function requestAd(adId, buttonElement) {
      const message = prompt('Введите сообщение для владельца объявления (опционально):', '');
      if (message === null) return; // Отмена

      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      buttonElement.disabled = true;
      buttonElement.textContent = 'Отправка...';

      try {
        const response = await fetch(`/api/ads/${adId}/request`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message })
        });

        if (response.ok) {
          const data = await response.json();
          alert('Запрос отправлен! Владелец объявления получит уведомление.');
          buttonElement.textContent = 'Запрос отправлен';
          buttonElement.style.background = '#27ae60';
          buttonElement.disabled = true;
        } else {
          const data = await response.json();
          alert('Ошибка: ' + (data.message || 'Не удалось отправить запрос'));
          buttonElement.disabled = false;
          buttonElement.textContent = 'Отправить запрос';
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
        buttonElement.disabled = false;
        buttonElement.textContent = 'Отправить запрос';
      }
    }

    // Отменить принятие объявления
    async function cancelAcceptance(adId, buttonElement) {
      if (!confirm('Вы уверены, что хотите отменить принятие этого объявления?')) {
        return;
      }

      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      buttonElement.disabled = true;
      buttonElement.textContent = 'Обработка...';

      try {
        const response = await fetch(`/api/ads/${adId}/accept`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          alert('Принятие объявления отменено');
          loadAds(); // Reload ads to update the list
        } else {
          let errorMessage = 'Не удалось отменить принятие';
          const responseText = await response.text();
          if (responseText) {
            try {
              const data = JSON.parse(responseText);
              errorMessage = data.message || errorMessage;
            } catch (parseError) {
              errorMessage = responseText;
            }
          }
          alert('Ошибка: ' + errorMessage);
          buttonElement.disabled = false;
          buttonElement.textContent = 'Отменить принятие';
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
        buttonElement.disabled = false;
        buttonElement.textContent = 'Отменить принятие';
      }
    }

    // Hamburger menu functionality
    document.addEventListener('DOMContentLoaded', () => {
      const hamburgerBtn = document.getElementById('hamburger-btn');
      const mainNav = document.getElementById('main-nav');

      if (hamburgerBtn && mainNav) {
        hamburgerBtn.addEventListener('click', () => {
          hamburgerBtn.classList.toggle('active');
          mainNav.classList.toggle('active');
        });

        // Close menu when clicking on a link
        mainNav.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            hamburgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
          });
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
          if (!hamburgerBtn.contains(e.target) && !mainNav.contains(e.target)) {
            hamburgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
          }
        });
      }
    });

  </script>
</body>
</html>
