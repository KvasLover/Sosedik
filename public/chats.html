<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чаты - Соседик</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Header -->
  <div id="header-root"></div>

  <!-- Main -->
  <main>
    <h1>Мои чаты</h1>

    <div id="auth-check" class="hidden">
      <p>Вы не авторизованы. <a href="/login.html">Войти</a></p>
    </div>

    <div id="chats-content">
      <div id="chats-list">
        <!-- Чаты будут загружены сюда -->
      </div>
    </div>
  </main>

  <script src="js/header.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentUserId = null;

    // Get user ID from JWT token
    function getUserIdFromToken() {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return null;
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.id;
      } catch (e) {
        return null;
      }
    }

    // Load chats
    async function loadChats() {
      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        document.getElementById('auth-check').classList.remove('hidden');
        document.getElementById('chats-content').classList.add('hidden');
        return;
      }

      try {
        const response = await fetch('/api/messages/conversations', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          displayChats(data.conversations);
        } else {
          document.getElementById('chats-list').innerHTML = '<p>Ошибка загрузки чатов</p>';
        }
      } catch (error) {
        document.getElementById('chats-list').innerHTML = '<p>Ошибка: ' + error.message + '</p>';
      }
    }

    // Display chats
    function displayChats(conversations) {
      const chatsList = document.getElementById('chats-list');

      if (conversations.length === 0) {
        chatsList.innerHTML = '<p>У вас пока нет чатов</p>';
        return;
      }

      chatsList.innerHTML = conversations.map(conv => {
        const savedPhoto = localStorage.getItem(`sosedik_photo_${conv.partnerId}`);
        let avatarHtml;

        if (savedPhoto) {
          avatarHtml = `<img src="${savedPhoto}" alt="${conv.partnerName}">`;
        } else if (conv.partnerPhoto) {
          avatarHtml = `<img src="${conv.partnerPhoto}" alt="${conv.partnerName}">`;
        } else {
          avatarHtml = `<span>${(conv.partnerName || 'С')[0].toUpperCase()}</span>`;
        }

        return `
          <div class="chat-item" onclick="openChat(${conv.partnerId})">
            <div class="chat-avatar">${avatarHtml}</div>
            <div class="chat-info">
              <h3>${conv.partnerName}</h3>
              <p>${conv.lastMessage}</p>
            </div>
            <div class="chat-time">${new Date(conv.lastTime).toLocaleDateString()}</div>
          </div>
        `;
      }).join('');
    }

    // Open chat with partner
    function openChat(partnerId) {
      window.location.href = `/chat.html?with=${partnerId}`;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadChats();

      // Hamburger menu functionality
      const hamburgerBtn = document.getElementById('hamburger-btn');
      const mainNav = document.getElementById('main-nav');

      if (hamburgerBtn && mainNav) {
        hamburgerBtn.addEventListener('click', () => {
          hamburgerBtn.classList.toggle('active');
          mainNav.classList.toggle('active');
        });

        // Close menu when clicking on a link
        mainNav.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            hamburgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
          });
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
          if (!hamburgerBtn.contains(e.target) && !mainNav.contains(e.target)) {
            hamburgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
          }
        });
      }
    });
  </script>
</body>
</html>
