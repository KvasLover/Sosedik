<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат - Соседик</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .chat-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 200px);
    }

    .chat-header {
      background: #f8f9fa;
      padding: 15px;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #ffffff;
      border-bottom: 1px solid #dee2e6;
    }

    .message {
      margin-bottom: 15px;
      padding: 10px 15px;
      border-radius: 10px;
      max-width: 70%;
    }

    .message.sent {
      background: #007bff;
      color: white;
      margin-left: auto;
      text-align: right;
    }

    .message.received {
      background: #f1f3f4;
      color: #333;
    }

    .chat-input-area {
      padding: 15px;
      background: #f8f9fa;
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid #dee2e6;
      border-radius: 20px;
      outline: none;
    }

    .chat-send-btn {
      padding: 10px 20px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    .chat-send-btn:hover {
      background: #218838;
    }

    .back-btn {
      background: #6c757d;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .back-btn:hover {
      background: #5a6268;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="logo"><a href="/">Соседик</a></div>
      <nav>
        <a href="/">Главная</a>
        <a href="/ads.html">Объявления</a>
        <a href="/rentals.html">Аренда</a>
        <a href="/chats.html">Чаты</a>
        <a href="/profile.html">Профиль</a>
        <a href="#" onclick="logout(); return false;">Выйти</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div id="auth-check" class="hidden">
      <p>Вы не авторизованы. <a href="/login.html">Войти</a></p>
    </div>

    <div id="chat-content">
      <button class="back-btn" onclick="history.back()">← Назад</button>

      <div class="chat-container">
        <div class="chat-header">
          <div style="width: 40px; height: 40px; background: #007bff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">
            <span id="chat-avatar">П</span>
          </div>
          <div>
            <h3 id="chat-partner">Загрузка...</h3>
            <small style="color: #666;">Чат с пользователем</small>
          </div>
        </div>

        <div class="chat-messages" id="messages-container"></div>

        <div class="chat-input-area">
          <input type="text" class="chat-input" id="message-input" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
          <button class="chat-send-btn" onclick="sendMessage()">Отправить</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Получить ID собеседника из URL
    const urlParams = new URLSearchParams(window.location.search);
    const partnerIdRaw = urlParams.get('with');
    const partnerId = partnerIdRaw ? parseInt(partnerIdRaw, 10) : null;
    const token = localStorage.getItem('sosedik_token');
    let partnerName = null;

    if (!partnerId) {
      document.getElementById('chat-content').innerHTML = '<p>Собеседник не указан</p>';
    } else if (!token) {
      document.getElementById('chat-content').classList.add('hidden');
      document.getElementById('auth-check').classList.remove('hidden');
    } else {
      loadChatPartner();
    }

    // Загрузить информацию о собеседнике и историю чата
    async function loadChatPartner() {
      try {
        const response = await fetch(`/api/messages?with=${encodeURIComponent(partnerId)}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || 'Не удалось загрузить чат');
        }

        const data = await response.json();
        partnerName = data.partner?.name?.trim() || 'Соседик без имени';
        document.getElementById('chat-partner').textContent = partnerName;

        const savedPhoto = localStorage.getItem(`sosedik_photo_${partnerId}`);
        const avatarEl = document.getElementById('chat-avatar');
        if (savedPhoto) {
          avatarEl.innerHTML = `<img src="${savedPhoto}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
        } else if (data.partner?.photo) {
          avatarEl.innerHTML = `<img src="${data.partner.photo}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
        } else {
          avatarEl.textContent = partnerName.charAt(0).toUpperCase();
        }

        renderMessages(data.messages);
      } catch (error) {
        console.error('Ошибка загрузки собеседника:', error);
        document.getElementById('chat-content').innerHTML = `<p>Ошибка загрузки чата: ${error.message}</p>`;
      }
    }

    // Отправить сообщение
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const message = input.value.trim();

      if (!message) return;

      try {
        const response = await fetch('/api/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ receiverId: parseInt(partnerId, 10), content: message })
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'Не удалось отправить сообщение');
        }

        addMessage(message, 'sent');
        input.value = '';
        input.focus();
        scrollChatToBottom();
      } catch (error) {
        console.error('Ошибка отправки сообщения:', error);
        alert('Ошибка отправки: ' + error.message);
      }
    }

    // Обработчик Enter
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
      }
    }

    // Отобразить массив сообщений
    function renderMessages(messages) {
      const messagesContainer = document.getElementById('messages-container');
      messagesContainer.innerHTML = '';

      messages.forEach(msg => {
        const type = msg.sender_id === getCurrentUserId() ? 'sent' : 'received';
        addMessage(msg.content, type, msg.created_at);
      });

      scrollChatToBottom();
    }

    // Добавить сообщение в чат
    function addMessage(text, type, createdAt = null) {
      const messagesContainer = document.getElementById('messages-container');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;

      const now = createdAt ? new Date(createdAt) : new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      messageDiv.innerHTML = `
        <div>${text}</div>
        <small style="color: ${type === 'sent' ? '#ccc' : '#999'}; font-size: 11px;">${timeString}</small>
      `;

      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function scrollChatToBottom() {
      const messagesContainer = document.getElementById('messages-container');
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function getCurrentUserId() {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return parseInt(payload.id, 10);
      } catch (e) {
        return null;
      }
    }

    // Выход
    function logout(event) {
      if (event) event.preventDefault();
      localStorage.removeItem('sosedik_token');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
