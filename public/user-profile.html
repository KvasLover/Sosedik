<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя - Соседик</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .profile-meta {
            color: #718096;
            margin-bottom: 24px;
        }

        .stat-item {
            margin: 8px 0;
        }

        .ads-list {
            margin-top: 24px;
        }

        .ad-card {
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ad-card:hover {
            background: #f7fafc;
            border-color: #667eea;
        }

        .ad-title {
            font-weight: 600;
            font-size: 18px;
        }

        .ad-details {
            font-size: 14px;
            color: #4a5568;
            margin-top: 6px;
        }

        .no-ads {
            color: #718096;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div id="header-root"></div>
    <main>
        <button onclick="history.back()" style="margin-bottom: 20px;" class="btn-ghost">← Назад</button>

        <div id="profile-container" class="user-profile-card" style="display: none;">
            <!-- Шапка профиля -->
            <div class="profile-header">
                <div class="profile-avatar-large" id="profile-avatar">
                    <span id="avatar-placeholder">👤</span>
                </div>
                <div class="profile-header-info">
                    <h1 id="profile-name">Загрузка...</h1>
                    <div class="profile-badges">
                        <span id="profile-level" class="badge badge-level"></span>
                        <span id="profile-verified" class="badge badge-verified" style="display:none;">✅
                            Верифицирован</span>
                        <span id="profile-moderator" class="badge badge-moderator" style="display:none;">🛡
                            Модератор</span>
                    </div>
                    <p class="profile-date">На сайте с <span id="profile-date"></span></p>
                </div>
            </div>

            <!-- Статистика -->
            <div class="profile-stats-grid">
                <div class="stat-box">
                    <span class="stat-icon">🤝</span>
                    <div class="stat-text">
                        <span class="stat-number" id="stat-completed">0</span>
                        <span>сделок завершено</span>
                    </div>
                </div>
                <div class="stat-box">
                    <span class="stat-icon">⭐</span>
                    <div class="stat-text">
                        <span class="stat-number" id="stat-reputation">—</span>
                        <span>репутация</span>
                    </div>
                </div>
                <div class="stat-box">
                    <span class="stat-icon">📦</span>
                    <div class="stat-text">
                        <span class="stat-number" id="stat-active-ads">0</span>
                        <span>активных объявлений</span>
                    </div>
                </div>
            </div>

            <!-- Общие сделки -->
            <div id="common-deals-section" class="common-deals" style="display: none;">
                <span>🤝 У вас есть общие сделки с этим пользователем</span>
            </div>

            <!-- Кнопки действий -->
            <div class="profile-actions" id="profile-actions">
                <button id="friend-btn" class="btn-primary">Загрузка...</button>
                <button id="write-btn" class="btn-secondary" style="display:none;">💬 Написать</button>
            </div>

            <!-- Объявления -->
            <div class="profile-ads-section">
                <h2>Активные объявления</h2>
                <div id="profile-ads-list"></div>
            </div>
        </div>
        <div id="profile-loading">Загрузка...</div>
    </main>
    <script src="js/header_new.js"></script>
    <script>
        const userId = new URLSearchParams(window.location.search).get('userId');
        const token = localStorage.getItem('sosedik_token');
        let currentFriendStatus = null;

        if (!userId) {
            document.getElementById('profile-loading').innerHTML = '<p>Не указан пользователь</p>';
        } else {
            loadUserProfile(userId);
        }

        async function loadUserProfile(profileId) {
            try {
                // Загружаем профиль (публичный)
                const resp = await fetch(`/api/users/${profileId}/profile`);
                if (!resp.ok) throw new Error('Пользователь не найден');
                const profile = await resp.json();
                renderProfile(profile);
                document.getElementById('profile-container').style.display = 'block';
                document.getElementById('profile-loading').style.display = 'none';
            } catch (err) {
                document.getElementById('profile-loading').innerHTML = `<p>Ошибка: ${err.message}</p>`;
            }
        }

        function renderProfile(profile) {
            // Основная информация
            document.getElementById('profile-name').textContent = profile.name || 'Соседик без имени';
            document.getElementById('profile-date').textContent = new Date(profile.createdAt).toLocaleDateString();

            // Аватар (если есть фото)
            const avatarContainer = document.getElementById('profile-avatar');
            const savedPhoto = localStorage.getItem(`sosedik_photo_${profile.id}`);
            if (savedPhoto) {
                avatarContainer.innerHTML = `<img src="${savedPhoto}" alt="Аватар">`;
            } else if (profile.photo) {
                avatarContainer.innerHTML = `<img src="${profile.photo}" alt="Аватар">`;
            } else {
                avatarContainer.innerHTML = `<span id="avatar-placeholder">👤</span>`;
            }

            // Уровень и статусы (если API возвращает level, verified, moderator)
            // Пока используем заглушки, т.к. API /users/:id/profile не все поля возвращает
            // Мы можем дополнить API или просто показать, что есть. Для красоты покажем уровень, если есть.
            const levelEl = document.getElementById('profile-level');
            if (profile.level !== undefined) {
                levelEl.textContent = getLevelName(profile.level);
                if (profile.level >= 2) document.getElementById('profile-verified').style.display = 'inline';
                if (profile.level >= 3) document.getElementById('profile-moderator').style.display = 'inline';
            } else {
                levelEl.textContent = 'Участник';
            }

            // Статистика
            document.getElementById('stat-completed').textContent = profile.completedCount || 0;
            document.getElementById('stat-reputation').textContent = profile.hasPositive ? '👍 Положительная' : 'Нейтральная';
            document.getElementById('stat-active-ads').textContent = profile.activeAds ? profile.activeAds.length : 0;

            // Общие сделки
            if (profile.hasCommonDeals) {
                document.getElementById('common-deals-section').style.display = 'block';
            }

            // Список активных объявлений
            const adsList = document.getElementById('profile-ads-list');
            if (profile.activeAds && profile.activeAds.length > 0) {
                adsList.innerHTML = profile.activeAds.map(ad => `
      <div class="mini-ad" onclick="location.href='/ad-details.html?id=${ad.id}'">
        <strong>${escapeHtml(ad.title)}</strong>
        <small>${escapeHtml(ad.category)}${ad.price ? ` • ${ad.price} руб.` : ''}</small>
      </div>
    `).join('');
            } else {
                adsList.innerHTML = '<p class="no-ads">Нет активных объявлений</p>';
            }

            // Кнопки друзей (только для авторизованных и не себя)
            if (token && profile.id !== getUserIdFromToken()) {
                setupFriendButtons(profile.id);
            } else {
                document.getElementById('profile-actions').style.display = 'none';
            }
        }

        async function setupFriendButtons(profileId) {
            const friendBtn = document.getElementById('friend-btn');
            const writeBtn = document.getElementById('write-btn');

            try {
                const [friendResp, requestResp] = await Promise.all([
                    fetch(`/api/friends/check/${profileId}`, { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch(`/api/friends/check-request-status/${profileId}`, { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                const friendData = await friendResp.json();
                const requestData = await requestResp.json();

                if (friendData.isFriend) {
                    friendBtn.textContent = 'Удалить из друзей';
                    friendBtn.className = 'btn-danger';
                    writeBtn.style.display = 'inline-block';
                    currentFriendStatus = 'friend';
                } else if (requestData.status === 'pending') {
                    friendBtn.textContent = 'Запрос отправлен';
                    friendBtn.disabled = true;
                    friendBtn.className = 'btn-secondary';
                    currentFriendStatus = 'pending';
                } else {
                    friendBtn.textContent = 'Добавить в друзья';
                    friendBtn.className = 'btn-primary';
                    currentFriendStatus = 'none';
                }

                friendBtn.onclick = () => handleFriendAction(profileId);
                writeBtn.onclick = () => location.href = `/chat.html?with=${profileId}`;
            } catch (e) {
                console.error(e);
                friendBtn.textContent = 'Ошибка';
            }
        }

        async function handleFriendAction(profileId) {
            try {
                if (currentFriendStatus === 'friend') {
                    const resp = await fetch(`/api/friends/remove/${profileId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (resp.ok) {
                        location.reload();
                    } else {
                        const err = await resp.json();
                        alert('Ошибка: ' + err.message);
                    }
                } else if (currentFriendStatus === 'none') {
                    const resp = await fetch(`/api/friends/add/${profileId}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await resp.json();
                    if (resp.ok) {
                        document.getElementById('friend-btn').textContent = 'Запрос отправлен';
                        document.getElementById('friend-btn').disabled = true;
                        document.getElementById('friend-btn').className = 'btn-secondary';
                        currentFriendStatus = 'pending';
                    } else {
                        alert('Ошибка: ' + (data.message || 'Не удалось'));
                    }
                }
            } catch (e) {
                alert('Ошибка сети');
            }
        }

        function getUserIdFromToken() {
            if (!token) return null;
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                return payload.id;
            } catch (e) {
                return null;
            }
        }

        function getLevelName(level) {
            const names = { 0: 'Гость', 1: 'Зарегистрированный жилец', 2: 'Верифицированный жилец', 3: 'Модератор', 4: 'Администратор' };
            return names[level] || '';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
        }
    </script>
</body>

</html>
