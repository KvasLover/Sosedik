<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя - Соседик</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .profile-meta {
            color: #718096;
            margin-bottom: 24px;
        }

        .stat-item {
            margin: 8px 0;
        }

        .ads-list {
            margin-top: 24px;
        }

        .ad-card {
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ad-card:hover {
            background: #f7fafc;
            border-color: #667eea;
        }

        .ad-title {
            font-weight: 600;
            font-size: 18px;
        }

        .ad-details {
            font-size: 14px;
            color: #4a5568;
            margin-top: 6px;
        }

        .no-ads {
            color: #718096;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div id="header-root"></div>
    <main>
        <button onclick="history.back()" style="margin-bottom: 20px;">← Назад</button>
        <div id="profile-container" class="profile-container">Загрузка...</div>
        <div id="common-deals" class="stat-item"></div>
        <div id="friend-section">
            <button id="friend-btn">Добавить в друзья</button>
            <button id="write-btn" style="display: none; margin-left: 10px;">Написать</button>
        </div>
    </main>
    <script src="js/header_new.js"></script>
    <script>
        const userId = new URLSearchParams(window.location.search).get('userId');
        if (!userId) {
            document.getElementById('profile-container').innerHTML = '<p>Не указан пользователь</p>';
        } else {
            fetch(`/api/users/${userId}/profile`)
                .then(res => { if (!res.ok) throw new Error('Пользователь не найден'); return res.json(); })
                .then(profile => renderProfile(profile))
                .catch(err => { document.getElementById('profile-container').innerHTML = `<p>Ошибка: ${err.message}</p>`; });
        }

        function renderProfile(profile) {
            let statsHtml = '';
            if (profile.completedCount === 0) {
                statsHtml = '<div class="stat-item">✨ Новый пользователь</div>';
            } else {
                statsHtml = `<div class="stat-item">✔ Завершено: ${profile.completedCount}</div>`;
                if (profile.hasPositive) statsHtml += '<div class="stat-item">✔ Есть положительные отзывы</div>';
            }

            const adsHtml = profile.activeAds?.length
                ? profile.activeAds.map(ad => `
          <div class="ad-card" onclick="location.href='/ad-details.html?id=${ad.id}'">
            <div class="ad-title">${escapeHtml(ad.title)}</div>
            <div class="ad-details">Категория: ${escapeHtml(ad.category)}${ad.price ? ` • ${ad.price} руб.` : ''}</div>
          </div>
        `).join('')
                : '<div class="no-ads">Нет активных объявлений</div>';

            document.getElementById('profile-container').innerHTML = `
        <div class="profile-name">${escapeHtml(profile.name || 'Соседик без имени')}</div>
        <div class="profile-meta">На сайте с ${new Date(profile.createdAt).toLocaleDateString()}</div>
        <div class="stats-section"><h3>Статистика</h3>${statsHtml}</div>
        <div class="ads-list"><h3>Активные объявления</h3>${adsHtml}</div>
      `;

            // Отображение общих сделок
            const commonDealsDiv = document.getElementById('common-deals');
            commonDealsDiv.textContent = profile.hasCommonDeals ? '✓ У вас есть общие сделки' : '✗ У вас нет общих сделок';

            // Кнопка "Написать" всегда перенаправляет в глобальный чат (доступен только если друзья)
            document.getElementById('write-btn').addEventListener('click', () => {
                window.location.href = `/chat.html?with=${profile.id}`;
            });

            // --- Кнопки друзей (логика с запросами) ---
            const friendBtn = document.getElementById('friend-btn');
            const writeBtn = document.getElementById('write-btn');
            const token = localStorage.getItem('sosedik_token');
            if (!token) return;

            // Проверить статус
            Promise.all([
                fetch(`/api/friends/check/${profile.id}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()),
                fetch(`/api/friends/check-request-status/${profile.id}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json())
            ]).then(([friendData, requestData]) => {
                const isFriend = friendData.isFriend;
                const requestStatus = requestData.status; // 'pending', 'accepted', 'rejected' или null

                if (isFriend) {
                    friendBtn.textContent = 'Удалить из друзей';
                    writeBtn.style.display = 'inline-block';
                } else if (requestStatus === 'pending') {
                    friendBtn.textContent = 'Запрос отправлен';
                    friendBtn.disabled = true;
                    writeBtn.style.display = 'none';
                } else {
                    friendBtn.textContent = 'Добавить в друзья';
                    friendBtn.disabled = false;
                    writeBtn.style.display = 'none';
                }
            });

            friendBtn.addEventListener('click', async () => {
                const currentText = friendBtn.textContent;
                if (currentText === 'Запрос отправлен') return; // нельзя отменить пока

                if (currentText === 'Удалить из друзей') {
                    try {
                        const resp = await fetch(`/api/friends/remove/${profile.id}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (resp.ok) {
                            friendBtn.textContent = 'Добавить в друзья';
                            friendBtn.disabled = false;
                            writeBtn.style.display = 'none';
                        } else {
                            const err = await resp.json();
                            alert('Ошибка: ' + err.message);
                        }
                    } catch (err) {
                        alert('Ошибка сети: ' + err.message);
                    }
                } else {
                    // Добавить в друзья (отправить запрос)
                    try {
                        const resp = await fetch(`/api/friends/add/${profile.id}`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await resp.json();
                        if (resp.ok) {
                            friendBtn.textContent = 'Запрос отправлен';
                            friendBtn.disabled = true;
                            writeBtn.style.display = 'none';
                        } else {
                            alert('Ошибка: ' + (data.message || 'Не удалось отправить запрос'));
                        }
                    } catch (err) {
                        alert('Ошибка сети: ' + err.message);
                    }
                }
            });

            // Кнопка "Написать" (уже есть обработчик)
            writeBtn.addEventListener('click', () => {
                window.location.href = `/chat.html?with=${profile.id}`;
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }
    </script>
</body>

</html>
