<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детали аренды - Соседик</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <!-- Header -->
  <div id="header-root"></div>

  <!-- Main -->
  <main>
    <div id="rental-details" style="max-width: 800px; margin: 0 auto; padding: 0 20px;">
      <button onclick="history.back()" class="btn-ghost" style="margin-bottom: 20px;">← Назад</button>

      <div id="rental-content" class="detail-card">
        <h1 id="rental-title" class="detail-title">Загрузка...</h1>

        <div class="detail-meta">
          <span class="meta-badge" id="rental-category">Категория</span>
          <span class="meta-separator">•</span>
          <span class="meta-date" id="rental-created">Дата</span>
        </div>

        <div id="rental-photos" class="detail-photos">
          <!-- Photos will be displayed here -->
        </div>

        <div class="detail-section-grid">
          <div class="detail-section">
            <h3 class="section-label">Ценность вещи</h3>
            <p class="section-content" id="rental-value">-</p>
          </div>

          <div class="detail-section">
            <h3 class="section-label">Статус</h3>
            <p class="section-content" id="rental-status">Доступна</p>
          </div>
        </div>
        <div class="detail-section">
          <h3 class="section-label">Залог</h3>
          <p class="section-content" id="rental-deposit">-</p>
        </div>
        <div class="detail-section">
          <h3 class="section-label">Описание</h3>
          <p class="section-content" id="rental-description">-</p>
        </div>

        <div class="detail-section" id="rental-terms-section" style="display: none;">
          <h3 class="section-label">Условия аренды</h3>
          <p class="section-content" id="rental-terms">-</p>
        </div>

        <div class="detail-divider"></div>

        <div class="detail-author-section">
          <h3 class="section-title">Владелец вещи</h3>
          <p><strong>Имя:</strong> <span id="rental-owner"></span></p>
          <p><strong>Контакт:</strong> <span id="rental-contact">Не указан</span></p>
        </div>

        <div id="rental-actions" class="detail-actions">
        </div>
      </div>
    </div>

    <div id="auth-check" class="hidden">
      <p>Вы не авторизованы. <a href="/login.html">Войти</a></p>
    </div>
  </main>

  <script src="js/header_new.js" defer></script>
  <script src="js/app.js"></script>
  <script>
    let currentRental = null;
    let currentUserId = null;

    // Get user ID from JWT token
    function getUserIdFromToken() {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return null;
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.id;
      } catch (e) {
        return null;
      }
    }

    // Load rental details
    async function loadRentalDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const adId = urlParams.get('id');

      if (!adId) {
        document.getElementById('rental-content').innerHTML = '<p>Ошибка: ID объявления не указан</p>';
        return;
      }

      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        document.getElementById('auth-check').classList.remove('hidden');
        document.getElementById('rental-details').classList.add('hidden');
        return;
      }

      try {
        // Получаем текущего пользователя
        const userResponse = await fetch('/api/users/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (userResponse.ok) {
          const user = await userResponse.json();
          currentUserId = user.id;
        }

        // Загружаем объявление
        const response = await fetch(`/api/ads/${adId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          currentRental = await response.json();
          displayRentalDetails(currentRental);
        } else {
          document.getElementById('rental-content').innerHTML = '<p>Объявление не найдено</p>';
        }
      } catch (error) {
        document.getElementById('rental-content').innerHTML = '<p>Ошибка загрузки: ' + error.message + '</p>';
      }
    }

    // Display rental details
    function displayRentalDetails(ad) {
      const isOwner = currentUserId === ad.user_id;

      document.getElementById('rental-title').textContent = ad.item_name || ad.title;
      document.getElementById('rental-category').textContent = ad.category;
      document.getElementById('rental-value').textContent = ad.deposit ? `${ad.deposit} руб.` : 'Не указан';
      document.getElementById('rental-owner').textContent = 'Загрузка...';
      document.getElementById('rental-created').textContent = new Date(ad.created_at).toLocaleDateString();

      // Ценность вещи
      const valueSpan = document.getElementById('rental-value');
      valueSpan.textContent = ad.value_category ? getValueLabel(ad.value_category) : 'Не указана';

      // Залог
      const depositSpan = document.getElementById('rental-deposit'); // нужно добавить id в HTML
      if (depositSpan) {
        depositSpan.textContent = ad.deposit ? ad.deposit + ' руб.' : 'Не нужен';
      }
      // Описание
      const descSpan = document.getElementById('rental-description');
      if (descSpan) {
        descSpan.textContent = ad.description || '—';
      }

      // Условия аренды
      const terms = ad.terms;
      if (terms) {
        document.getElementById('rental-terms-section').style.display = 'block';
        document.getElementById('rental-terms').textContent = terms;
      } else {
        // если условий нет, можно скрыть блок или показать «не указаны»
        document.getElementById('rental-terms-section').style.display = 'none';
      }

      // Фото (из localStorage)
      const photosDiv = document.getElementById('rental-photos');
      const storedPhoto = localStorage.getItem(`sosedik_rental_photo_${ad.id}`);
      if (storedPhoto) {
        const photoImg = document.createElement('img');
        photoImg.src = storedPhoto;
        photoImg.className = 'detail-photo';
        photosDiv.appendChild(photoImg);
      }

      // Загрузка информации о владельце
      loadOwnerInfo(ad.user_id, ad.contact);

      // Кнопки действий
      displayRentalActions(ad, isOwner);
    }

    // Load owner information
    async function loadOwnerInfo(ownerId, contactFromAd = null) {
      try {
        const token = localStorage.getItem('sosedik_token');
        const response = await fetch(`/api/users/${ownerId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const owner = await response.json();
          document.getElementById('rental-owner').textContent = owner.name || 'Пользователь';
          document.getElementById('rental-contact').textContent = contactFromAd || owner.phone || 'Не указан';
        } else {
          document.getElementById('rental-owner').textContent = 'Ошибка загрузки';
        }
      } catch (error) {
        document.getElementById('rental-owner').textContent = 'Ошибка загрузки';
      }
    }

    // Display rental actions
    function displayRentalActions(ad, isOwner) {
      const actionsDiv = document.getElementById('rental-actions');
      actionsDiv.innerHTML = '';

      if (isOwner) {
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-danger';
        deleteBtn.textContent = 'Удалить объявление об аренде';
        deleteBtn.onclick = () => {
          if (confirm('Вы уверены, что хотите удалить это объявление?')) {
            deleteRentalFromDetails(ad.id);
          }
        };
        actionsDiv.appendChild(deleteBtn);
      } else {
        // Кнопка "В избранное"
        const favoriteBtn = document.createElement('button');
        favoriteBtn.id = 'favorite-btn';
        favoriteBtn.className = 'btn-secondary';
        favoriteBtn.textContent = '♡ В избранное';
        favoriteBtn.onclick = () => toggleFavorite('ad', ad.id, favoriteBtn);
        actionsDiv.appendChild(favoriteBtn);

        checkFavoriteStatus('ad', ad.id).then(isFavorite => {
          if (isFavorite) {
            favoriteBtn.classList.add('active');
            favoriteBtn.textContent = '♥ В избранном';
          }
        });

        // Кнопка "Запросить аренду"
        const requestBtn = document.createElement('button');
        checkIfAlreadyRequested(ad.id, requestBtn);
        requestBtn.className = 'btn-primary';
        requestBtn.textContent = 'Запросить аренду';
        requestBtn.onclick = () => requestRental(ad.id, requestBtn);
        actionsDiv.appendChild(requestBtn);

        // Кнопка "Связаться с владельцем"
        const contactBtn = document.createElement('button');
        contactBtn.className = 'btn-success';
        contactBtn.textContent = 'Связаться с владельцем';
        contactBtn.onclick = () => {
          window.location.href = `/chat.html?with=${ad.user_id}`;
        };
        actionsDiv.appendChild(contactBtn);
      }
    }

    // Delete rental
    async function deleteRentalFromDetails(adId) {
      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch(`/api/ads/${adId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          alert('Объявление удалено');
          window.location.href = '/rentals.html';
        } else {
          const data = await response.json();
          alert('Ошибка: ' + data.message);
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Request rental
    async function requestRental(adId, buttonElement) {
      const message = prompt('Введите сообщение владельцу (опционально):', '');
      if (message === null) return;
      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch(`/api/ads/${adId}/request`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ message })
        });
        if (response.ok) {
          alert('Запрос аренды отправлен');
          if (buttonElement) {
            buttonElement.textContent = 'Запрос отправлен';
            buttonElement.disabled = true;
          }
        } else {
          const data = await response.json();
          alert('Ошибка: ' + (data.message || 'Не удалось отправить запрос'));
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Get value label
    function getValueLabel(value) {
      const labels = {
        'low': 'Низкая (до 20 руб)',
        'medium': 'Средняя (20-100 руб)',
        'high': 'Высокая (более 100 руб)'
      };
      return labels[value] || value;
    }

    // Проверить статус избранного
    async function checkFavoriteStatus(itemType, itemId) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return false;

      try {
        const response = await fetch(`/api/favorites/${itemType}/${itemId}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          return data.isFavorite;
        }

        return false;
      } catch (error) {
        console.error('Error checking favorite status:', error);
        return false;
      }
    }

    // Добавить/удалить из избранного
    async function toggleFavorite(itemType, itemId, buttonElement) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      const isFavorite = buttonElement.classList.contains('active');

      try {
        const method = isFavorite ? 'DELETE' : 'POST';
        const url = isFavorite ? `/api/favorites/${itemType}/${itemId}` : '/api/favorites';
        const response = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: isFavorite ? undefined : JSON.stringify({ itemType, itemId })
        });

        if (response.ok) {
          buttonElement.classList.toggle('active');
          if (isFavorite) {
            buttonElement.innerHTML = '♡ В избранное';
            buttonElement.style.borderColor = '#ccc';
            buttonElement.style.color = '#333';
          } else {
            buttonElement.innerHTML = '♥ В избранном';
            buttonElement.style.borderColor = '#e74c3c';
            buttonElement.style.color = '#e74c3c';
          }
        } else {
          let errorMessage = 'Не удалось обновить избранное';
          try {
            const data = await response.json();
            errorMessage = data.message || errorMessage;
          } catch (e) {
            errorMessage = `Ошибка ${response.status}: ${response.statusText}`;
          }
          alert('Ошибка: ' + errorMessage);
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    async function checkIfAlreadyRequested(adId, buttonElement) {
      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch('/api/ads/requests/outgoing', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const requests = await response.json();
          const exists = requests.some(req => req.ad_id === adId && ['pending', 'accepted', 'in_progress'].includes(req.status));
          if (exists) {
            buttonElement.textContent = 'Запрос отправлен';
            buttonElement.disabled = true;
            buttonElement.style.opacity = '0.6';
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadRentalDetails();
    });
  </script>
</body>

</html>
