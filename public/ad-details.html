<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детали объявления - Соседик</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="logo"><a href="/">Соседик</a></div>
      <nav id="main-nav">
        <a href="/">Главная</a>
        <a href="/ads.html">Объявления</a>
        <a href="/rentals.html">Аренда</a>
        <a href="/chats.html">Чаты</a>
        <a href="/profile.html">Профиль</a>
        <a href="#" onclick="logout(); return false;">Выйти</a>
      </nav>
      <button class="hamburger" id="hamburger-btn" aria-label="Меню">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div id="ad-details">
      <button onclick="history.back()" style="margin-bottom: 20px;">← Назад</button>
      <div id="ad-content">
        <h1 id="ad-title">Загрузка...</h1>
        <p><strong>Категория:</strong> <span id="ad-category"></span></p>
        <p><strong>Тип:</strong> <span id="ad-type"></span></p>
        <p id="ad-description"></p>
        <p id="ad-price" style="display: none;"><strong>Цена:</strong> <span id="price-value"></span> руб.</p>
        <p id="ad-urgency" style="display: none;"><strong>Срочность:</strong> <span id="urgency-value"></span></p>
        <p id="ad-location" style="display: none;"><strong>Местоположение:</strong> <span id="location-value"></span></p>
        <p><strong>Автор:</strong> <span id="ad-author"></span></p>
        <p><small>Создано: <span id="ad-created"></span></small></p>

        <div id="ad-actions" style="margin-top: 20px;">
        </div>
      </div>
    </div>

    <div id="auth-check" class="hidden">
      <p>Вы не авторизованы. <a href="/login.html">Войти</a></p>
    </div>
  </main>

  <script>
    // Получить ID объявления из URL
    const urlParams = new URLSearchParams(window.location.search);
    const adId = urlParams.get('id');

    if (!adId) {
      document.getElementById('ad-content').innerHTML = '<p>Объявление не найдено</p>';
    }

    let currentAdOwnerId = null;

    // Получить ID пользователя из токена
    function getUserIdFromToken() {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return null;

      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.id;
      } catch (e) {
        return null;
      }
    }

    // Загрузить детали объявления
    async function loadAdDetails() {
      try {
        const response = await fetch(`/api/ads/${adId}`);
        const ad = await response.json();

        if (response.ok) {
          const currentUserId = getUserIdFromToken();
          const isOwner = currentUserId && parseInt(ad.user_id) === parseInt(currentUserId);

          console.log('Current user ID:', currentUserId);
          console.log('Ad user ID:', ad.user_id);
          console.log('Is owner:', isOwner);

          document.getElementById('ad-title').textContent = ad.title + (isOwner ? ' (Ваше объявление)' : '');
          document.getElementById('ad-category').textContent = ad.category;
          document.getElementById('ad-type').textContent = ad.type === 'offer' ? 'Предложение' : 'Запрос';
          document.getElementById('ad-description').textContent = ad.description;

          if (ad.price) {
            document.getElementById('ad-price').style.display = 'block';
            document.getElementById('price-value').textContent = ad.price;
          }

          if (ad.urgency) {
            document.getElementById('ad-urgency').style.display = 'block';
            document.getElementById('urgency-value').textContent = ad.urgency ? 'Срочно' : 'Не срочно';
          }

          if (ad.location) {
            document.getElementById('ad-location').style.display = 'block';
            document.getElementById('location-value').textContent = ad.location;
          }

          document.getElementById('ad-author').textContent = `Пользователь ${ad.user_id}`;
          document.getElementById('ad-created').textContent = new Date(ad.created_at).toLocaleString();
          currentAdOwnerId = ad.user_id;

          // Если владелец и объявление принято, показать информацию
          if (isOwner && ad.accepted_by) {
            const acceptedInfo = document.createElement('p');
            acceptedInfo.style.color = '#27ae60';
            acceptedInfo.style.fontWeight = 'bold';
            acceptedInfo.textContent = `Принято пользователем ${ad.acceptor_name || ('#' + ad.accepted_by)}`;
            document.getElementById('ad-content').appendChild(acceptedInfo);
          }

          // Настроить кнопки действий
          const actionsDiv = document.getElementById('ad-actions');
          actionsDiv.innerHTML = ''; // Очистить существующие кнопки

          // Кнопки для чужих объявлений
          if (!isOwner) {
            // Кнопка "В избранное"
            const favoriteBtn = document.createElement('button');
            favoriteBtn.id = 'favorite-btn';
            favoriteBtn.innerHTML = '♡ В избранное';
            favoriteBtn.style.background = 'white';
            favoriteBtn.style.color = '#333';
            favoriteBtn.style.border = '2px solid #ccc';
            favoriteBtn.style.padding = '8px 12px';
            favoriteBtn.style.marginRight = '10px';
            favoriteBtn.style.cursor = 'pointer';
            favoriteBtn.style.borderRadius = '4px';
            favoriteBtn.onclick = () => toggleFavorite('ad', adId, favoriteBtn);
            actionsDiv.appendChild(favoriteBtn);

            // Проверить статус избранного
            checkFavoriteStatus('ad', adId).then(isFavorite => {
              if (isFavorite) {
                favoriteBtn.classList.add('active');
                favoriteBtn.innerHTML = '♥ В избранном';
                favoriteBtn.style.borderColor = '#e74c3c';
                favoriteBtn.style.color = '#e74c3c';
              }
            });

            // Кнопка "Отправить запрос" или статус
            if (!ad.accepted_by) {
              const requestBtn = document.createElement('button');
              requestBtn.textContent = 'Отправить запрос';
              requestBtn.style.background = '#3498db';
              requestBtn.style.color = 'white';
              requestBtn.style.border = 'none';
              requestBtn.style.padding = '10px 15px';
              requestBtn.style.marginRight = '10px';
              requestBtn.style.cursor = 'pointer';
              requestBtn.onclick = () => requestAd(adId, requestBtn);
              actionsDiv.appendChild(requestBtn);
            } else if (parseInt(ad.accepted_by) === parseInt(currentUserId)) {
              const statusSpan = document.createElement('span');
              statusSpan.textContent = '✓ Принято вами';
              statusSpan.style.color = '#27ae60';
              statusSpan.style.fontWeight = 'bold';
              statusSpan.style.marginRight = '10px';
              actionsDiv.appendChild(statusSpan);
            } else {
              const statusSpan = document.createElement('span');
              statusSpan.textContent = 'Принято другим пользователем';
              statusSpan.style.color = '#95a5a6';
              statusSpan.style.marginRight = '10px';
              actionsDiv.appendChild(statusSpan);
            }

            // Кнопка "Связаться с автором"
            const contactBtn = document.createElement('button');
            contactBtn.textContent = 'Связаться с автором';
            contactBtn.style.background = '#3498db';
            contactBtn.style.color = 'white';
            contactBtn.style.border = 'none';
            contactBtn.style.padding = '10px 15px';
            contactBtn.style.cursor = 'pointer';
            contactBtn.onclick = contactAuthor;
            actionsDiv.appendChild(contactBtn);
          }

          // Кнопка "Удалить объявление" только если владелец
          if (isOwner) {
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Удалить объявление';
            deleteBtn.style.background = '#e74c3c';
            deleteBtn.style.color = 'white';
            deleteBtn.style.border = 'none';
            deleteBtn.style.padding = '10px 15px';
            deleteBtn.style.cursor = 'pointer';
            deleteBtn.onclick = () => deleteAd(adId);
            actionsDiv.appendChild(deleteBtn);
          }
        } else {
          document.getElementById('ad-content').innerHTML = '<p>Объявление не найдено</p>';
        }
      } catch (error) {
        document.getElementById('ad-content').innerHTML = '<p>Ошибка загрузки: ' + error.message + '</p>';
      }
    }

    // Отправить запрос на принятие объявления
    async function requestAd(adId, buttonElement) {
      const message = prompt('Введите сообщение для владельца объявления (опционально):', '');
      if (message === null) return; // Отмена

      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      buttonElement.disabled = true;
      buttonElement.textContent = 'Отправка...';

      try {
        const response = await fetch(`/api/ads/${adId}/request`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message })
        });

        if (response.ok) {
          const data = await response.json();
          alert('Запрос отправлен! Владелец объявления получит уведомление.');
          buttonElement.textContent = 'Запрос отправлен';
          buttonElement.style.background = '#27ae60';
          buttonElement.disabled = true;
        } else {
          const data = await response.json();
          alert('Ошибка: ' + (data.message || 'Не удалось отправить запрос'));
          buttonElement.disabled = false;
          buttonElement.textContent = 'Отправить запрос';
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
        buttonElement.disabled = false;
        buttonElement.textContent = 'Отправить запрос';
      }
    }

    // Отменить принятие объявления
    async function cancelAcceptance(adId, buttonElement) {
      if (!confirm('Вы уверены, что хотите отменить принятие этого объявления?')) {
        return;
      }

      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      buttonElement.disabled = true;
      buttonElement.textContent = 'Обработка...';

      try {
        const response = await fetch(`/api/ads/${adId}/accept`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          alert('Принятие объявления отменено');
          location.reload(); // Reload page to update UI
        } else {
          let errorMessage = 'Не удалось отменить принятие';
          const responseText = await response.text();
          if (responseText) {
            try {
              const data = JSON.parse(responseText);
              errorMessage = data.message || errorMessage;
            } catch (parseError) {
              errorMessage = responseText;
            }
          }
          alert('Ошибка: ' + errorMessage);
          buttonElement.disabled = false;
          buttonElement.textContent = 'Отменить принятие';
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
        buttonElement.disabled = false;
        buttonElement.textContent = 'Отменить принятие';
      }
    }

    // Связаться с автором
    function contactAuthor() {
      if (!currentAdOwnerId) {
        alert('Ошибка: пользователь не найден');
        return;
      }
      window.location.href = `/chat.html?with=${currentAdOwnerId}`;
    }

    // Удалить объявление
    async function deleteAd(adId) {
      if (!confirm('Вы уверены, что хотите удалить это объявление?')) {
        return;
      }

      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch(`/api/ads/${adId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          alert('Объявление удалено');
          const returnHash = window.location.hash;
          if (returnHash && returnHash.startsWith('#')) {
            window.location.href = `/profile.html${returnHash}`;
          } else {
            window.location.href = '/ads.html';
          }
        } else {
          const data = await response.json();
          alert('Ошибка: ' + (data.message || 'Не удалось удалить объявление'));
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Выход
    function logout() {
      localStorage.removeItem('sosedik_token');
      window.location.href = '/login.html';
    }

    // Проверить статус избранного
    async function checkFavoriteStatus(itemType, itemId) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return false;

      try {
        const response = await fetch(`/api/favorites/${itemType}/${itemId}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        if (response.ok) {
          const data = await response.json();
          return data.isFavorite;
        }
        
        return false;
      } catch (error) {
        console.error('Error checking favorite status:', error);
        return false;
      }
    }

    // Добавить/удалить из избранного
    async function toggleFavorite(itemType, itemId, buttonElement) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      const isFavorite = buttonElement.classList.contains('active');

      try {
        const method = isFavorite ? 'DELETE' : 'POST';
        const url = isFavorite ? `/api/favorites/${itemType}/${itemId}` : '/api/favorites';
        const response = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: isFavorite ? undefined : JSON.stringify({ itemType, itemId })
        });

        if (response.ok) {
          buttonElement.classList.toggle('active');
          if (isFavorite) {
            buttonElement.innerHTML = '♡ В избранное';
            buttonElement.style.borderColor = '#ccc';
            buttonElement.style.color = '#333';
          } else {
            buttonElement.innerHTML = '♥ В избранном';
            buttonElement.style.borderColor = '#e74c3c';
            buttonElement.style.color = '#e74c3c';
          }
        } else {
          let errorMessage = 'Не удалось обновить избранное';
          try {
            const data = await response.json();
            errorMessage = data.message || errorMessage;
          } catch (e) {
            errorMessage = `Ошибка ${response.status}: ${response.statusText}`;
          }
          alert('Ошибка: ' + errorMessage);
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Проверить авторизацию
    const token = localStorage.getItem('sosedik_token');
    if (!token) {
      document.getElementById('auth-check').classList.remove('hidden');
      document.getElementById('ad-details').classList.add('hidden');
    } else {
      loadAdDetails();
    }

    // Hamburger menu functionality
    document.addEventListener('DOMContentLoaded', () => {
      const hamburgerBtn = document.getElementById('hamburger-btn');
      const mainNav = document.getElementById('main-nav');

      if (hamburgerBtn && mainNav) {
        hamburgerBtn.addEventListener('click', () => {
          hamburgerBtn.classList.toggle('active');
          mainNav.classList.toggle('active');
        });

        // Close menu when clicking on a link
        mainNav.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            hamburgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
          });
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
          if (!hamburgerBtn.contains(e.target) && !mainNav.contains(e.target)) {
            hamburgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
          }
        });
      }
    });
  </script>
</body>
</html>
