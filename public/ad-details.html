<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детали объявления - Соседик</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <!-- Header -->
  <div id="header-root"></div>

  <!-- Main -->
  <main>
    <div id="ad-details" style="max-width: 800px; margin: 0 auto; padding: 0 20px;">
      <button class="btn-ghost" onclick="history.back()" style="margin-bottom: 20px;">← Назад</button>
      
      <div id="ad-content" class="detail-card">
        <h1 id="ad-title" class="detail-title">Загрузка...</h1>
        
        <div class="detail-meta">
          <span class="meta-badge" id="ad-category">Категория</span>
          <span class="meta-separator">•</span>
          <span class="meta-date" id="ad-created">Дата</span>
        </div>

        <div class="detail-section">
          <h2 class="section-title">Описание</h2>
          <p id="ad-description" class="section-content"></p>
        </div>

        <div class="detail-section" id="ad-price-section" style="display: none;">
          <h3 class="section-label">Цена</h3>
          <p class="section-content price-highlight" id="price-value">-</p>
        </div>

        <div class="detail-section-grid">
          <div class="detail-section" id="ad-preferred-time-section" style="display: none;">
            <h3 class="section-label">Желаемое время/дата</h3>
            <p class="section-content" id="preferred-time-value">-</p>
          </div>

          <div class="detail-section" id="ad-location-section" style="display: none;">
            <h3 class="section-label">Местоположение</h3>
            <p class="section-content" id="location-value">-</p>
          </div>
        </div>

        <div class="detail-section" id="ad-terms-section" style="display: none;">
          <h3 class="section-label">Условия</h3>
          <p class="section-content" id="terms-value">-</p>
        </div>

        <div class="detail-section" id="ad-urgency-section" style="display: none;">
          <h3 class="section-label">Срочность</h3>
          <p class="section-content" id="urgency-value">-</p>
        </div>

        <div class="detail-divider"></div>

        <div class="detail-author-section">
          <h3 class="section-title">Контакт с автором</h3>
          <p><strong>Автор:</strong> <span id="ad-author"></span></p>
          <p><strong>Контакт:</strong> <span id="ad-contact">Не указан</span></p>
        </div>

        <div id="ad-actions" class="detail-actions">
        </div>
      </div>
    </div>

    <div id="auth-check" class="hidden">
      <p>Вы не авторизованы. <a href="/login.html">Войти</a></p>
    </div>
  </main>

  <script>
    // Получить ID объявления из URL
    const urlParams = new URLSearchParams(window.location.search);
    const adId = urlParams.get('id');

    if (!adId) {
      document.getElementById('ad-content').innerHTML = '<p>Объявление не найдено</p>';
    }

    let currentAdOwnerId = null;

    // Получить ID пользователя из токена
    function getUserIdFromToken() {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return null;

      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.id;
      } catch (e) {
        return null;
      }
    }

    // Проверить, есть ли активный запрос от текущего пользователя на данное объявление
    async function checkActiveRequestForAd(adId, buttonElement) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return;

      try {
        const response = await fetch('/api/ads/requests/outgoing', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const requests = await response.json();
          const hasActive = requests.some(req =>
            req.ad_id === parseInt(adId) &&
            (req.status === 'pending' || req.status === 'accepted' || req.status === 'in_progress')
          );
          if (hasActive) {
            buttonElement.textContent = 'Запрос отправлен';
            buttonElement.style.background = '#27ae60';
            buttonElement.disabled = true;
          }
        }
      } catch (error) {
        console.error('Ошибка проверки запроса:', error);
      }
    }

    // Загрузить детали объявления
    async function loadAdDetails() {
      try {
        const response = await fetch(`/api/ads/${adId}`);
        const ad = await response.json();

        if (response.ok) {
          const currentUserId = getUserIdFromToken();
          const isOwner = currentUserId && parseInt(ad.user_id) === parseInt(currentUserId);

          console.log('Current user ID:', currentUserId);
          console.log('Ad user ID:', ad.user_id);
          console.log('Is owner:', isOwner);

          document.getElementById('ad-title').textContent = ad.title + (isOwner ? ' (Ваше объявление)' : '');
          document.getElementById('ad-category').textContent = ad.category;
          document.getElementById('ad-description').textContent = ad.description;

          if (ad.price) {
            document.getElementById('ad-price-section').style.display = 'block';
            document.getElementById('price-value').textContent = ad.price + ' руб.';
          }

          if (ad.preferred_time) {
            document.getElementById('ad-preferred-time-section').style.display = 'block';
            document.getElementById('preferred-time-value').textContent = ad.preferred_time;
          }
          if (ad.terms) {
            document.getElementById('ad-terms-section').style.display = 'block';
            document.getElementById('terms-value').textContent = ad.terms;
          }

          if (ad.urgency) {
            document.getElementById('ad-urgency-section').style.display = 'block';
            document.getElementById('urgency-value').textContent = ad.urgency ? 'Срочно' : 'Не срочно';
          }

          if (ad.location) {
            document.getElementById('ad-location-section').style.display = 'block';
            document.getElementById('location-value').textContent = ad.location;
          }

          document.getElementById('ad-author').textContent = ad.author_name || `Пользователь ${ad.user_id}`;
          document.getElementById('ad-contact').textContent = ad.contact || 'Не указан';
          document.getElementById('ad-created').textContent = new Date(ad.created_at).toLocaleDateString();
          currentAdOwnerId = ad.user_id;

          // Если владелец и объявление принято, показать информацию
          if (isOwner && ad.accepted_by) {
            const acceptedInfo = document.createElement('p');
            acceptedInfo.style.color = '#27ae60';
            acceptedInfo.style.fontWeight = 'bold';
            acceptedInfo.textContent = `Принято пользователем ${ad.acceptor_name || ('#' + ad.accepted_by)}`;
            document.getElementById('ad-content').appendChild(acceptedInfo);
          }

          // Настроить кнопки действий
          const actionsDiv = document.getElementById('ad-actions');
          actionsDiv.innerHTML = ''; // Очистить существующие кнопки

          // Кнопки для чужих объявлений
                    // Кнопки для чужих объявлений
          if (!isOwner) {
            // Кнопка "В избранное"
            const favoriteBtn = document.createElement('button');
            favoriteBtn.id = 'favorite-btn';
            favoriteBtn.className = 'btn-secondary';
            favoriteBtn.textContent = '♡ В избранное';
            favoriteBtn.onclick = () => toggleFavorite('ad', adId, favoriteBtn);
            actionsDiv.appendChild(favoriteBtn);

            checkFavoriteStatus('ad', adId).then(isFavorite => {
              if (isFavorite) {
                favoriteBtn.classList.add('active');
                favoriteBtn.textContent = '♥ В избранном';
              }
            });

            if (!ad.accepted_by) {
              const requestBtn = document.createElement('button');
              requestBtn.className = 'btn-primary';
              requestBtn.textContent = 'Отправить запрос';
              requestBtn.onclick = () => requestAd(adId, requestBtn);
              actionsDiv.appendChild(requestBtn);
              checkActiveRequestForAd(adId, requestBtn);
            } else if (parseInt(ad.accepted_by) === parseInt(currentUserId)) {
              const statusSpan = document.createElement('span');
              statusSpan.textContent = '✓ Принято вами';
              statusSpan.style.cssText = 'color: #27ae60; font-weight: bold; display: inline-block; padding: 10px 16px; border-radius: 6px; background: #f0fdf4;';
              actionsDiv.appendChild(statusSpan);
            } else {
              const statusSpan = document.createElement('span');
              statusSpan.textContent = 'Принято другим пользователем';
              statusSpan.style.cssText = 'color: #95a5a6; display: inline-block; padding: 10px 16px; border-radius: 6px; background: #f1f5f9;';
              actionsDiv.appendChild(statusSpan);
            }

            const contactBtn = document.createElement('button');
            contactBtn.className = 'btn-success';
            contactBtn.textContent = 'Связаться с автором';
            contactBtn.onclick = () => {
              window.location.href = `/chat.html?partnerId=${ad.user_id}`;
            };
            actionsDiv.appendChild(contactBtn);
          } else {
            // Кнопка "Удалить" для владельца
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-danger';
            deleteBtn.textContent = 'Удалить объявление';
            deleteBtn.onclick = () => {
              if (confirm('Вы уверены, что хотите удалить это объявление?')) {
                deleteAdFromDetails(adId);
              }
            };
            actionsDiv.appendChild(deleteBtn);
          }
        } else {
          document.getElementById('ad-content').innerHTML = '<p>Объявление не найдено</p>';
        }
      } catch (error) {
        document.getElementById('ad-content').innerHTML = '<p>Ошибка загрузки: ' + error.message + '</p>';
      }
    }

    // Удалить объявление
    async function deleteAdFromDetails(adId) {
      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch(`/api/ads/${adId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          alert('Объявление удалено');
          window.location.href = '/ads.html';
        } else {
          alert('Ошибка удаления объявления');
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Отправить запрос на принятие объявления
    async function requestAd(adId, buttonElement) {
      const message = prompt('Введите сообщение для владельца объявления (опционально):', '');
      if (message === null) return; // Отмена

      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      buttonElement.disabled = true;
      buttonElement.textContent = 'Отправка...';

      try {
        const response = await fetch(`/api/ads/${adId}/request`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message })
        });

        if (response.ok) {
          const data = await response.json();
          alert('Запрос отправлен! Владелец объявления получит уведомление.');
          buttonElement.textContent = 'Запрос отправлен';
          buttonElement.style.background = '#27ae60';
          buttonElement.disabled = true;
        } else {
          const data = await response.json();
          alert('Ошибка: ' + (data.message || 'Не удалось отправить запрос'));
          buttonElement.disabled = false;
          buttonElement.textContent = 'Отправить запрос';
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
        buttonElement.disabled = false;
        buttonElement.textContent = 'Отправить запрос';
      }
    }

    // Отменить принятие объявления
    async function cancelAcceptance(adId, buttonElement) {
      if (!confirm('Вы уверены, что хотите отменить принятие этого объявления?')) {
        return;
      }

      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      buttonElement.disabled = true;
      buttonElement.textContent = 'Обработка...';

      try {
        const response = await fetch(`/api/ads/${adId}/accept`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          alert('Принятие объявления отменено');
          location.reload(); // Reload page to update UI
        } else {
          let errorMessage = 'Не удалось отменить принятие';
          const responseText = await response.text();
          if (responseText) {
            try {
              const data = JSON.parse(responseText);
              errorMessage = data.message || errorMessage;
            } catch (parseError) {
              errorMessage = responseText;
            }
          }
          alert('Ошибка: ' + errorMessage);
          buttonElement.disabled = false;
          buttonElement.textContent = 'Отменить принятие';
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
        buttonElement.disabled = false;
        buttonElement.textContent = 'Отменить принятие';
      }
    }

    // Связаться с автором
    function contactAuthor() {
      if (!currentAdOwnerId) {
        alert('Ошибка: пользователь не найден');
        return;
      }
      window.location.href = `/chat.html?with=${currentAdOwnerId}`;
    }

    // Удалить объявление
    async function deleteAd(adId) {
      if (!confirm('Вы уверены, что хотите удалить это объявление?')) {
        return;
      }

      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch(`/api/ads/${adId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          alert('Объявление удалено');
          const returnHash = window.location.hash;
          if (returnHash && returnHash.startsWith('#')) {
            window.location.href = `/profile.html${returnHash}`;
          } else {
            window.location.href = '/ads.html';
          }
        } else {
          const data = await response.json();
          alert('Ошибка: ' + (data.message || 'Не удалось удалить объявление'));
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Выход
    function logout() {
      localStorage.removeItem('sosedik_token');
      window.location.href = '/login.html';
    }

    // Проверить статус избранного
    async function checkFavoriteStatus(itemType, itemId) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return false;

      try {
        const response = await fetch(`/api/favorites/${itemType}/${itemId}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          return data.isFavorite;
        }

        return false;
      } catch (error) {
        console.error('Error checking favorite status:', error);
        return false;
      }
    }

    // Добавить/удалить из избранного
    async function toggleFavorite(itemType, itemId, buttonElement) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      const isFavorite = buttonElement.classList.contains('active');

      try {
        const method = isFavorite ? 'DELETE' : 'POST';
        const url = isFavorite ? `/api/favorites/${itemType}/${itemId}` : '/api/favorites';
        const response = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: isFavorite ? undefined : JSON.stringify({ itemType, itemId })
        });

        if (response.ok) {
          buttonElement.classList.toggle('active');
          if (isFavorite) {
            buttonElement.innerHTML = '♡ В избранное';
            buttonElement.style.borderColor = '#ccc';
            buttonElement.style.color = '#333';
          } else {
            buttonElement.innerHTML = '♥ В избранном';
            buttonElement.style.borderColor = '#e74c3c';
            buttonElement.style.color = '#e74c3c';
          }
        } else {
          let errorMessage = 'Не удалось обновить избранное';
          try {
            const data = await response.json();
            errorMessage = data.message || errorMessage;
          } catch (e) {
            errorMessage = `Ошибка ${response.status}: ${response.statusText}`;
          }
          alert('Ошибка: ' + errorMessage);
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Проверить авторизацию
    const token = localStorage.getItem('sosedik_token');
    if (!token) {
      document.getElementById('auth-check').classList.remove('hidden');
      document.getElementById('ad-details').classList.add('hidden');
    } else {
      loadAdDetails();
      //loadPendingRequestsState();
    }

    // Load pending requests and update button states
    async function loadPendingRequestsState() {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return;

      try {
        const response = await fetch('/api/ads/requests/outgoing', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const outgoingRequests = await response.json();

          // Check if there's a request for this specific ad
          const hasRequest = outgoingRequests.some(req =>
            req.ad_id === parseInt(adId) &&
            (req.status === 'pending' || req.status === 'accepted')
          );

          if (hasRequest) {
            const requestBtn = document.querySelector('button');
            if (requestBtn && requestBtn.textContent.includes('Отправить запрос')) {
              requestBtn.textContent = 'Запрос отправлен';
              requestBtn.style.background = '#27ae60';
              requestBtn.disabled = true;
            }
          }
        }
      } catch (error) {
        console.error('Ошибка загрузки состояния запросов:', error.message);
      }
    }
  </script>
  <script src="js/header_new.js" defer></script>
</body>

</html>
