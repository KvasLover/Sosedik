<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <title>Голосования – Соседик</title>
    <link rel=" stylesheet" href="/css/styles.css">
    <style>
        .elections-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .elections-header {
            margin-bottom: 30px;
        }

        .elections-header h1 {
            margin-bottom: 10px;
        }

        .election-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            transition: all 0.3s;
        }

        .election-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.1);
        }

        .election-card h3 {
            margin: 0 0 15px 0;
            font-size: 1.4rem;
            color: #1a202c;
        }

        .election-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .election-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: #4a5568;
        }

        .votes-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .votes-yes {
            color: #38a169;
        }

        .votes-no {
            color: #e53e3e;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #edf2f7;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .vote-buttons {
            display: flex;
            gap: 10px;
        }

        .history-card {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #38a169;
        }

        .history-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            color: #718096;
        }

        @media (max-width: 768px) {
            .election-meta {
                flex-direction: column;
                gap: 10px;
            }

            .vote-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div id="header-root"></div>
    <main>
        <div class="elections-container">
            <div class="elections-header">
                <h1>🗳 Голосования</h1>
                <p>Здесь выбираются модераторы сообщества. От вашего голоса зависит, кто будет помогать делать соседство
                    лучше.</p>
            </div>

            <section>
                <h2 style="margin-bottom: 20px;">Активные голосования</h2>
                <div id="elections-list">
                    <div class="empty-state">Загрузка...</div>
                </div>
            </section>

            <section style="margin-top: 40px;">
                <h2 style="margin-bottom: 20px;">🏆 Избранные модераторы</h2>
                <div id="completed-elections-list">
                    <div class="empty-state">Загрузка...</div>
                </div>
            </section>
        </div>
    </main>
    <script src="js/header_new.js"></script>
    <script src="js/app.js"></script>
    <script>
        const token = localStorage.getItem('sosedik_token');
        if (!token) window.location.href = '/login.html';

        async function loadElections() {
            try {
                const response = await fetch('/api/elections/active', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Ошибка загрузки');
                const { elections } = await response.json();
                renderElections(elections);
            } catch (err) {
                document.getElementById('elections-list').innerHTML = `<div class="empty-state">${err.message}</div>`;
            }
        }

        function renderElections(elections) {
            const container = document.getElementById('elections-list');
            if (elections.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет активных голосований</div>';
                return;
            }

            container.innerHTML = elections.map(e => {
                const now = new Date();
                const end = new Date(e.end_time);
                const totalDuration = end - new Date(e.start_time);
                const elapsed = now - new Date(e.start_time);
                const progress = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
                const timeLeft = end > now ? getTimeLeft(end - now) : 'Завершено';

                return `
          <div class="election-card">
            <h3>Кандидат: <a href="/user-profile.html?userId=${e.candidate_id}">${escapeHtml(e.candidate_name)}</a></h3>
            <div class="election-meta">
              <div class="election-meta-item">📅 Начало: ${new Date(e.start_time).toLocaleString()}</div>
              <div class="election-meta-item">⏳ Окончание: ${new Date(e.end_time).toLocaleString()}</div>
              <div class="election-meta-item">⏱ Осталось: ${timeLeft}</div>
            </div>
            <div class="votes-stats">
              <span class="votes-yes">👍 За: ${e.yes_votes}</span>
              <span class="votes-no">👎 Против: ${e.no_votes}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${progress}%"></div>
            </div>
            <div class="vote-buttons">
              <button class="btn-success" onclick="vote(${e.id}, true)">👍 За</button>
              <button class="btn-danger" onclick="vote(${e.id}, false)">👎 Против</button>
            </div>
          </div>
        `;
            }).join('');
        }

        function getTimeLeft(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return `${minutes} мин ${seconds} сек`;
        }

        async function vote(electionId, voteValue) {
            try {
                const response = await fetch(`/api/elections/vote/${electionId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ vote: voteValue })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('Голос учтён');
                    loadElections();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Ошибка сети');
            }
        }

        async function loadCompletedElections() {
            try {
                const response = await fetch('/api/elections/completed', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Ошибка загрузки');
                const { elections } = await response.json();
                renderCompletedElections(elections);
            } catch (err) {
                document.getElementById('completed-elections-list').innerHTML = `<div class="empty-state">${err.message}</div>`;
            }
        }

        function renderCompletedElections(elections) {
            const container = document.getElementById('completed-elections-list');
            if (elections.length === 0) {
                container.innerHTML = '<div class="empty-state">Пока никто не был избран</div>';
                return;
            }

            container.innerHTML = elections.map(e => `
        <div class="history-card">
          <h3>Кандидат: <a href="/user-profile.html?userId=${e.candidate_id}">${escapeHtml(e.candidate_name)}</a></h3>
          <p>✅ Стал модератором</p>
          <p>Голосов «за»: ${e.yes_votes} | «против»: ${e.no_votes}</p>
          <p><small>Завершено: ${new Date(e.end_time).toLocaleString()}</small></p>
        </div>
      `).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
        }

        // Загрузка и периодическое обновление
        loadElections();
        loadCompletedElections();
        setInterval(loadElections, 10000);
        setInterval(loadCompletedElections, 30000);
    </script>
</body>

</html>
