<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Чат сделки</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div id="header-root"></div>
  <main>
    <button class="btn-ghost" onclick="history.back()">← Назад</button>
    <h1>Чат сделки</h1>
    <div class="chat-header">
      <div class="chat-avatar"><span>?</span></div>
      <div id="partner-link" style="font-weight: bold; margin-left: 10px;"></div>
    </div>
    <div id="deal-info" style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
      <p><strong>Статус:</strong> <span id="deal-status"></span></p>
      <p><strong>Цена:</strong> <span id="deal-price"></span></p>
      <p><strong>Время/дата:</strong> <span id="deal-time"></span></p>
      <p><strong>Комментарий:</strong> <span id="deal-comment"></span></p>
    </div>
    <div id="chat-messages" style="border:1px solid #ccc; height:400px; overflow-y:auto; padding:10px;"></div>
    <textarea id="message-text" rows="3" style="width:100%; margin-top:10px;"></textarea>
    <button id="send-btn" class="btn-primary">Отправить</button>
  </main>
  <script src="js/header_new.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get('requestId');
    if (!requestId) {
      document.body.innerHTML = '<p>Ошибка: не указан requestId</p>';
    } else {
      const token = localStorage.getItem('sosedik_token');
      if (!token) window.location.href = '/login.html';

      let currentUserId = null;
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        currentUserId = payload.id;
      } catch (e) { }

      // Функция загрузки информации о сделке
      async function loadDealAndPartner() {
        const response = await fetch(`/api/ads/requests/${requestId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const data = await response.json();
          // Отображаем статус и условия
          if (data.status === 'disputed') {
            const initiatorName = (data.dispute_initiator_id === currentUserId) ? 'Вы' : (data.creator_name || data.requester_name);
            const disputeHtml = `
    <div style="margin-top: 8px; padding: 8px; background: #fef3c7; border-radius: 6px;">
      ⚠️ Спор открыт пользователем ${initiatorName}.<br>
      Причина: ${data.dispute_reason || 'не указана'}
    </div>
  `;
            document.getElementById('deal-info').insertAdjacentHTML('beforeend', disputeHtml);
          }
          document.getElementById('deal-status').innerText = getStatusName(data.status);
          const price = data.agreed_price ?? data.ad_price ?? '—';
          const time = data.agreed_time ?? data.ad_time ?? '—';
          const comment = data.agreement_comment ?? data.ad_terms ?? '—';
          document.getElementById('deal-price').innerText = price;
          document.getElementById('deal-time').innerText = time;
          document.getElementById('deal-comment').innerText = comment;

          // Ссылка на профиль партнёра
          const otherUserId = (currentUserId === data.requester_id) ? data.ad_owner_id : data.requester_id;
          const otherName = (currentUserId === data.requester_id) ? data.creator_name : data.requester_name;
          const linkEl = document.getElementById('partner-link');
          if (linkEl) {
            linkEl.innerHTML = `<a href="/user-profile.html?userId=${otherUserId}">${escapeHtml(otherName)}</a>`;
          }
        } else {
          console.error('Ошибка загрузки данных сделки');
        }
      }

      // Функция загрузки сообщений
      async function loadMessages() {
        const response = await fetch(`/api/request-messages?requestId=${requestId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const data = await response.json();
          const container = document.getElementById('chat-messages');
          container.innerHTML = '';
          if (data.messages && data.messages.length) {
            data.messages.forEach(msg => {
              const div = document.createElement('div');
              div.innerHTML = `<strong>${escapeHtml(msg.sender_name || 'Пользователь')}:</strong> ${escapeHtml(msg.text)} <small>${new Date(msg.created_at).toLocaleString()}</small>`;
              container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
          } else {
            container.innerHTML = '<p>Нет сообщений</p>';
          }
        }
      }

      async function sendMessage() {
        const textarea = document.getElementById('message-text');
        const text = textarea.value.trim();
        if (!text) return alert('Введите текст');
        const response = await fetch('/api/request-messages', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ requestId, text })
        });
        if (response.ok) {
          textarea.value = '';
          loadMessages();
        } else {
          const err = await response.json();
          alert('Ошибка: ' + err.message);
        }
      }

      function getStatusName(status) {
        const statuses = {
          'pending': 'Ожидание',
          'accepted': 'Принято',
          'in_progress': 'В процессе',
          'completed': 'Завершено',
          'rejected': 'Отклонено',
          'cancelled': 'Отменено',
          'disputed': 'Спор'
        };
        return statuses[status] || status;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function (m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }

      // Запуск
      loadDealAndPartner();
      loadMessages();
      setInterval(loadMessages, 5000);
      document.getElementById('send-btn').addEventListener('click', sendMessage);
    }
  </script>
</body>

</html>
