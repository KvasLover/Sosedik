<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Чат сделки</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div id="header-root"></div>
  <main>
    <button class="btn-ghost" onclick="history.back()">← Назад</button>
    <h1>Чат сделки</h1>
    <div id="deal-info" style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
      <p><strong>Статус:</strong> <span id="deal-status"></span></p>
      <p><strong>Цена:</strong> <span id="deal-price"></span></p>
      <p><strong>Время/дата:</strong> <span id="deal-time"></span></p>
      <p><strong>Комментарий:</strong> <span id="deal-comment"></span></p>
    </div>
    <div id="chat-messages" style="border:1px solid #ccc; height:400px; overflow-y:auto; padding:10px;"></div>
    <textarea id="message-text" rows="3" style="width:100%; margin-top:10px;"></textarea>
    <button id="send-btn" class="btn-primary">Отправить</button>
  </main>
  <script src="js/header_new.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get('requestId');
    if (!requestId) {
      document.body.innerHTML = '<p>Ошибка: не указан requestId</p>';
    } else {
      let token = localStorage.getItem('sosedik_token');
      if (!token) window.location.href = '/login.html';

      function loadMessages() {
        fetch(`/api/request-messages?requestId=${requestId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
          .then(r => r.json())
          .then(data => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            if (data.messages && data.messages.length) {
              data.messages.forEach(msg => {
                const div = document.createElement('div');
                div.innerHTML = `<strong>${msg.sender_name || 'Пользователь'}:</strong> ${msg.text} <small>${new Date(msg.created_at).toLocaleString()}</small>`;
                container.appendChild(div);
              });
              container.scrollTop = container.scrollHeight;
            } else {
              container.innerHTML = '<p>Нет сообщений</p>';
            }
          }).catch(console.error);
      }

      function sendMessage() {
        const textarea = document.getElementById('message-text');
        const text = textarea.value.trim();
        if (!text) return alert('Введите текст');
        fetch('/api/request-messages', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ requestId, text })
        })
          .then(r => r.json())
          .then(() => {
            textarea.value = '';
            loadMessages();
          })
          .catch(console.error);
      }

      function getStatusName(status) {
        const statuses = {
          'pending': 'Ожидание',
          'accepted': 'Принято',
          'in_progress': 'В процессе',
          'completed': 'Завершено',
          'rejected': 'Отклонено',
          'cancelled': 'Отменено'
        };
        return statuses[status] || status;
      }

      async function loadDealInfo() {
        const requestId = new URLSearchParams(window.location.search).get('requestId');
        if (!requestId) return;
        const token = localStorage.getItem('sosedik_token');
        try {
          const response = await fetch(`/api/ads/requests/${requestId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (response.ok) {
            const data = await response.json();
            // Устанавливаем русский статус (одна строка)
            document.getElementById('deal-status').innerText = getStatusName(data.status);

            // Показываем согласованные условия, если есть, иначе из объявления
            const price = data.agreed_price ?? data.ad_price ?? '—';
            const time = data.agreed_time ?? data.ad_time ?? '—';
            const comment = data.agreement_comment ?? data.ad_terms ?? '—';
            document.getElementById('deal-price').textContent = price;
            document.getElementById('deal-time').textContent = time;
            document.getElementById('deal-comment').textContent = comment;
          }
        } catch (err) {
          console.error('Ошибка загрузки информации о сделке:', err);
        }
      }

      loadDealInfo();
      document.getElementById('send-btn').addEventListener('click', sendMessage);
      loadMessages();
      setInterval(loadMessages, 5000); // polling каждые 5 секунд
    }
  </script>
</body>

</html>
