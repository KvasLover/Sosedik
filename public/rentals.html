<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аренда - Соседик</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <!-- Header -->
  <div id="header-root"></div>

  <!-- Main -->
  <main>
    <h1>Аренда вещей</h1>

    <div id="auth-check" class="hidden">
      <p>Вы не авторизованы. <a href="/login.html">Войти</a></p>
    </div>

    <div id="rentals-content">
      <!-- Button to open create rental form -->
      <div style="margin-bottom: 20px;">
        <button id="create-rental-btn" class="btn-success" onclick="toggleCreateForm()">+ Сдать в аренду</button>
      </div>

      <!-- Form to create new rental (hidden by default) -->
      <div id="create-form" class="form-container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Сдать вещь в аренду</h2>
          <button class="btn-sm btn-secondary" onclick="toggleCreateForm()">✕</button>
        </div>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 1rem;">
          <span style="color: red;">*</span> – обязательные поля
        </p>
        <div class="form-group">
          <label for="rental-item-name">Название вещи: <span style="color: red;">*</span></label>
          <span class="error-hint" id="item-name-error"></span>
          <input type="text" id="rental-item-name" placeholder="Например: Дрель Bosch" required>
        </div>
        <div class="form-group">
          <label for="rental-category">Категория: <span style="color: red;">*</span></label>
          <span class="error-hint" id="category-error"></span>
          <select id="rental-category" required>
            <option value="">Укажите категорию</option>
            <option value="инструменты">Инструменты</option>
            <option value="электроника">Электроника</option>
            <option value="спорт">Спорт и отдых</option>
            <option value="бытовая техника">Бытовая техника</option>
            <option value="транспорт">Транспорт</option>
            <option value="другое">Другое</option>
          </select>
        </div>
        <div class="form-group">
          <label for="rental-description">Описание вещи</label>
          <textarea id="rental-description" placeholder="Опишите предмет: состояние, комплектация, особенности"
            rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="rental-terms">Условия аренды:</label>
          <textarea id="rental-terms" placeholder="Опишите условия аренды, стоимость, залог и т.д." rows="4"></textarea>
        </div>
        <div class="form-group">
          <label for="rental-value">Ценность вещи: <span style="color: red;">*</span></label>
          <span class="error-hint" id="value-error"></span>
          <select id="rental-value">
            <option value="">Укажите ценность</option>
            <option value="low">Низкая (до 20 руб)</option>
            <option value="medium">Средняя (20-100 руб)</option>
            <option value="high">Высокая (более 100 руб)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="deposit">Залог (руб):</label>
          <span class="error-hint" id="deposit-error"></span>
          <input type="text" id="deposit" class="form-control" inputmode="numeric" pattern="[0-9]*"
            placeholder="Сумма залога (целое число, или оставьте пустым)">
        </div>
        <div class="form-group">
          <label for="rental-photo">Фото вещи</label>
          <input type="file" id="rental-photo" accept="image/*" style="margin-bottom: 10px;">
          <div id="photo-preview" style="margin-top: 10px;"></div>
        </div>
        <button class="btn-primary" onclick="createRental()">
          <u041aреать объявление</button>
      </div>

      <!-- Filters -->
      <div style="margin-bottom: 20px;">
        <select id="filter-category">
          <option value="">Все категории</option>
          <option value="инструменты">Инструменты</option>
          <option value="электроника">Электроника</option>
          <option value="спорт">Спорт и отдых</option>
          <option value="бытовая техника">Бытовая техника</option>
          <option value="транспорт">Транспорт</option>
          <option value="другое">Другое</option>
        </select>
      </div>

      <!-- My rentals filter -->
      <span id="my-rentals-filter-container">
        <div style="margin-bottom: 20px;">
          <label>
            <input type="checkbox" id="filter-my-rentals"> Только мои объявления об аренде
          </label>
        </div>
      </span>

      <!-- Rentals list -->
      <div id="rentals-list">
        <!-- Rentals will be loaded here -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Соседик. Все права защищены.</p>
  </footer>

  <script src="js/header_new.js" defer></script>
  <script src="js/app.js"></script>
  <script>
    let allRentals = [];
    let currentPhotoData = null; // Store photo data for creation
    let currentUserId = null;

    // Проверить авторизацию при загрузке
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('sosedik_token');

      // Скрыть кнопку создания и фильтр "Только мои" для гостя
      const createBtn = document.getElementById('create-rental-btn');
      if (createBtn && !token) {
        createBtn.style.display = 'none';
      }
      const myFilter = document.getElementById('my-rentals-filter-container');
      if (myFilter && !token) {
        myFilter.style.display = 'none';
      }

      // Всегда загружаем аренду (гость тоже увидит)
      loadRentals();

      // Только авторизованным нужен обработчик фото
      if (token) {
        setupPhotoInputListener();
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function (m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    // Setup photo input listener using event delegation
    function setupPhotoInputListener() {
      document.addEventListener('change', function (e) {
        if (e.target.id === 'rental-photo') {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (event) {
              currentPhotoData = event.target.result; // Store as base64
              const previewDiv = document.getElementById('photo-preview');
              previewDiv.innerHTML = `<img src="${currentPhotoData}" style="max-width: 200px; max-height: 200px; border-radius: 4px;">`;
            };
            reader.readAsDataURL(file);
          }
        }
      });
    }

    // Открыть/закрыть форму создания
    function toggleCreateForm() {
      const form = document.getElementById('create-form');
      form.classList.toggle('hidden');
      // Reset photo when closing form
      if (form.classList.contains('hidden')) {
        currentPhotoData = null;
        document.getElementById('rental-photo').value = '';
        document.getElementById('photo-preview').innerHTML = '';
      }
    }

    // Загрузить аренды
    async function loadRentals() {
      try {
        const token = localStorage.getItem('sosedik_token');
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        const userResponse = token
          ? await fetch('/api/users/me', { headers })
          : null;

        if (userResponse && userResponse.ok) {
          const user = await userResponse.json();
          currentUserId = user.id;
        } else {
          // гость – оставляем currentUserId = null (он уже объявлен)
        }

        const response = await fetch('/api/ads?type=rental', { headers });

        if (response.ok) {
          allRentals = await response.json();
          displayRentals(allRentals);
        }
      } catch (error) {
        // ошибку гостю не показываем alert
        console.error('Ошибка загрузки аренды:', error);
      }
    }

    // Request rental
    async function requestRental(adId, buttonElement) {
      const message = prompt('Введите сообщение владельцу (опционально):', '');
      if (message === null) return;

      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch(`/api/ads/${adId}/request`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ message })
        });
        if (response.ok) {
          alert('Запрос аренды отправлен');
          if (buttonElement) {
            buttonElement.textContent = 'Запрос отправлен';
            buttonElement.disabled = true;
          }
        } else {
          const data = await response.json();
          alert('Ошибка: ' + (data.message || 'Не удалось отправить запрос'));
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Отобразить аренды
    function displayRentals(rentals) {
      const rentalsList = document.getElementById('rentals-list');
      rentalsList.innerHTML = '';

      if (rentals.length === 0) {
        rentalsList.innerHTML = '<p>Нет доступных вещей для аренды</p>';
        return;
      }

      rentals.forEach(ad => {
        const rentalDiv = document.createElement('div');
        rentalDiv.className = 'rental-item';
        rentalDiv.onclick = () => {
          window.location.href = `/rental-details.html?id=${ad.id}`;
        };

        const isOwner = ad.user_id === currentUserId;

        // Фото (из localStorage)
        const storedPhoto = localStorage.getItem(`sosedik_rental_photo_${ad.id}`);
        if (storedPhoto) {
          const img = document.createElement('img');
          img.src = storedPhoto;
          img.className = 'rental-photo';
          rentalDiv.appendChild(img);
        }

        // Заголовок и бейдж
        const titleDiv = document.createElement('div');
        titleDiv.className = 'rental-title-section';
        const titleH3 = document.createElement('h3');
        titleH3.innerHTML = (ad.item_name || ad.title) + (isOwner ? ' <span style="color: #27ae60; font-size: 12px;">(Ваше)</span>' : '');
        titleDiv.appendChild(titleH3);
        rentalDiv.appendChild(titleDiv);

        // Информация
        const contentDiv = document.createElement('div');
        contentDiv.className = 'rental-content';
        contentDiv.innerHTML = `
      ${currentUserId ? `<p><strong>Владелец:</strong> <a href="/user-profile.html?userId=${ad.user_id}">${escapeHtml(ad.author_name || 'Пользователь')}</a></p>` : ''}
      <p><strong>Ценность вещи:</strong> ${getValueLabel(ad.value_category) || 'не указана'}</p>
      <p><strong>Залог:</strong> ${ad.deposit ? ad.deposit + ' руб.' : 'не нужен'}</p>
      <p><strong>Описание:</strong> ${ad.description ? escapeHtml(ad.description.substring(0, 100)) + (ad.description.length > 100 ? '...' : '') : 'Не указано'}</p>
      <p><small>Добавлено: ${new Date(ad.created_at).toLocaleDateString()}</small></p>
    `;
        rentalDiv.appendChild(contentDiv);

        // Кнопки
        const footerDiv = document.createElement('div');
        footerDiv.className = 'rental-footer';

        // --- ГОСТЬ: только сообщение ---
        if (!currentUserId) {
          const guestMsg = document.createElement('p');
          guestMsg.className = 'u-text-muted u-font-sm';
          guestMsg.textContent = 'Войдите, чтобы взять в аренду';
          footerDiv.appendChild(guestMsg);
        } else if (isOwner) {
          // Владелец
          if (ad.accepted_by) {
            const acceptedInfo = document.createElement('p');
            acceptedInfo.style.color = '#27ae60';
            acceptedInfo.style.fontWeight = 'bold';
            acceptedInfo.style.fontSize = '14px';
            acceptedInfo.textContent = `Принято пользователем ${ad.acceptor_name || ('#' + ad.accepted_by)}`;
            footerDiv.appendChild(acceptedInfo);
          }

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn-sm btn-danger';
          deleteBtn.textContent = 'Удалить';
          deleteBtn.onclick = (e) => {
            e.stopPropagation();
            deleteRental(ad.id);
          };
          footerDiv.appendChild(deleteBtn);

        } else {
          // Не владелец (арендатор)
          if (ad.accepted_by && ad.accepted_by === currentUserId) {
            const statusSpan = document.createElement('span');
            statusSpan.style.color = '#27ae60';
            statusSpan.style.fontWeight = '600';
            statusSpan.style.fontSize = '14px';
            statusSpan.textContent = '✓ Принято вами';
            footerDiv.appendChild(statusSpan);
          } else {
            // Избранное
            const favBtn = document.createElement('button');
            favBtn.className = 'favorite-btn';
            favBtn.textContent = '♡';
            favBtn.onclick = (e) => {
              e.stopPropagation();
              toggleFavorite('ad', ad.id, favBtn);
            };
            footerDiv.appendChild(favBtn);
            if (currentUserId) {
              checkFavoriteStatus('ad', ad.id).then(isFavorite => {
                if (isFavorite) {
                  favBtn.classList.add('active');
                  favBtn.textContent = '♥';
                }
              });
            }

            // Кнопка "Запросить аренду"
            const requestBtn = document.createElement('button');
            requestBtn.className = 'btn-primary btn-sm';
            requestBtn.textContent = 'Запросить аренду';
            requestBtn.onclick = (e) => {
              e.stopPropagation();
              requestRental(ad.id, requestBtn);
            };
            footerDiv.appendChild(requestBtn);
            if (currentUserId) {
              checkIfAlreadyRequested(ad.id, requestBtn);
            }
          }
        }

        rentalDiv.appendChild(footerDiv);
        rentalsList.appendChild(rentalDiv);
      });
    }

    // Получить метку ценности
    function getValueLabel(value) {
      const labels = {
        'low': 'Низкая',
        'medium': 'Средняя',
        'high': 'Высокая'
      };
      return labels[value] || value;
    }

    // Delete rental
    async function deleteRental(adId) {
      if (!confirm('Вы уверены, что хотите удалить это объявление об аренде?')) return;
      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch(`/api/ads/${adId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          alert('Объявление удалено');
          loadRentals();
        } else {
          const data = await response.json();
          alert('Ошибка: ' + data.message);
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Создать аренду
    async function createRental() {
      // 1. Сбросить все видимые ошибки
      document.querySelectorAll('.error-hint').forEach(el => {
        el.style.display = 'none';
      });

      const token = localStorage.getItem('sosedik_token');
      const itemName = document.getElementById('rental-item-name').value.trim();
      const category = document.getElementById('rental-category').value;
      const valueCategory = document.getElementById('rental-value').value;

      let hasError = false;

      if (!itemName) {
        document.getElementById('item-name-error').textContent = 'Введите название вещи';
        document.getElementById('item-name-error').style.display = 'block';
        hasError = true;
      }

      if (!category) {
        document.getElementById('category-error').textContent = 'Выберите категорию';
        document.getElementById('category-error').style.display = 'block';
        hasError = true;
      }

      if (!valueCategory) {
        document.getElementById('value-error').textContent = 'Укажите ценность вещи';
        document.getElementById('value-error').style.display = 'block';
        hasError = true;
      }

      if (hasError) {
        return; // Прерываем выполнение, ошибки подсвечены
      }

      // Дальше ваш обычный код создания (без alert):
      const rentalTerms = document.getElementById('rental-terms').value;
      const itemDescription = document.getElementById('rental-description')?.value.trim() || null;

      const depositInput = document.getElementById('deposit');
      const depositRaw = depositInput.value.trim();
      let deposit = null;

      if (depositRaw !== '') {
        const depositNum = Number(depositRaw);
        if (isNaN(depositNum) || depositNum < 0 || !Number.isInteger(depositNum)) {
          document.getElementById('deposit-error').textContent = 'Введите корректную сумму залога (целое число)';
          document.getElementById('deposit-error').style.display = 'block';
          hasError = true;
        } else {
          deposit = depositNum;
        }
      }

      // ВОТ ЭТУ СТРОКУ НУЖНО ДОБАВИТЬ:
      if (hasError) {
        return;
      }

      try {
        const response = await fetch('/api/ads', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            type: 'rental',
            category: category,
            title: itemName,
            description: itemDescription,
            terms: rentalTerms || null,
            deposit: deposit,   // не оборачиваем Number() ещё раз
            valueCategory: valueCategory
          })
        });

        const data = await response.json();
        if (response.ok) {
          if (currentPhotoData) {
            localStorage.setItem(`sosedik_rental_photo_${data.ad.id}`, currentPhotoData);
          }
          alert('Объявление создано!');
          toggleCreateForm();
          loadRentals();
        } else {
          alert('Ошибка: ' + data.message);
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Фильтрация
    document.getElementById('filter-category').addEventListener('change', applyFilters);
    document.getElementById('filter-my-rentals').addEventListener('change', applyFilters);

    function applyFilters() {
      const category = document.getElementById('filter-category').value;
      const onlyMyRentals = document.getElementById('filter-my-rentals').checked;

      let filteredRentals = allRentals;

      if (category) {
        filteredRentals = filteredRentals.filter(rental => rental.category === category);
      }

      if (onlyMyRentals) {
        filteredRentals = filteredRentals.filter(rental => rental.user_id === currentUserId);
      }

      displayRentals(filteredRentals);
    }

    // Проверить статус избранного
    async function checkFavoriteStatus(itemType, itemId) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) return false;

      try {
        const response = await fetch(`/api/favorites/${itemType}/${itemId}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          return data.isFavorite;
        }

        return false;
      } catch (error) {
        console.error('Error checking favorite status:', error);
        return false;
      }
    }

    // Добавить/удалить из избранного
    async function toggleFavorite(itemType, itemId, buttonElement) {
      const token = localStorage.getItem('sosedik_token');
      if (!token) {
        alert('Необходимо войти в систему');
        return;
      }

      const isFavorite = buttonElement.classList.contains('active');

      try {
        const method = isFavorite ? 'DELETE' : 'POST';
        const url = isFavorite ? `/api/favorites/${itemType}/${itemId}` : '/api/favorites';
        const response = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: isFavorite ? undefined : JSON.stringify({ itemType, itemId })
        });

        if (response.ok) {
          buttonElement.classList.toggle('active');
          buttonElement.innerHTML = isFavorite ? '♡' : '♥';
        } else {
          let errorMessage = 'Не удалось обновить избранное';
          try {
            const data = await response.json();
            errorMessage = data.message || errorMessage;
          } catch (e) {
            // If response is not JSON, use status text
            errorMessage = `Ошибка ${response.status}: ${response.statusText}`;
          }
          alert('Ошибка: ' + errorMessage);
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    async function checkIfAlreadyRequested(adId, buttonElement) {
      const token = localStorage.getItem('sosedik_token');
      try {
        const response = await fetch('/api/ads/requests/outgoing', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const requests = await response.json();
          const exists = requests.some(req => req.ad_id === adId && ['pending', 'accepted', 'in_progress'].includes(req.status));
          if (exists) {
            buttonElement.textContent = 'Запрос отправлен';
            buttonElement.disabled = true;
            buttonElement.style.opacity = '0.6';
          }
        }
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>

</html>
