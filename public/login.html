<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход - Соседик</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div id="header-root"></div>

  <main>
    <div id="login-page">
      <div class="form-container">
        <h2>Вход</h2>
        <div class="form-group">
          <label for="login-phone">Телефон:</label>
          <input type="tel" id="login-phone" placeholder="+375 (__) ___-__-__" required>
          <span class="error-hint" id="login-phone-error"></span>
        </div>
        <div class="form-group">
          <label for="login-password">Пароль:</label>
          <input type="password" id="login-password" required>
          <span class="error-hint" id="login-password-error"></span>
        </div>
        <button class="btn-primary" onclick="login()">Войти</button>
      </div>

      <div class="form-container">
        <h2>Регистрация</h2>
        <div class="form-group">
          <label for="register-phone">Телефон:</label>
          <input type="tel" id="register-phone" placeholder="+375 (__) ___-__-__" required>
          <span class="error-hint" id="register-phone-error"></span>
        </div>
        <div class="form-group">
          <label for="register-password">Пароль:</label>
          <input type="password" id="register-password" required>
        </div>
        <!-- Блок для ввода кода (скрыт изначально) -->
        <div class="form-group" id="code-section" style="display: none;">
          <p id="code-hint" style="color: #2d3748; margin-bottom: 8px;"></p>
          <label for="register-code">Код из SMS:</label>
          <input type="text" id="register-code" placeholder="6-значный код" maxlength="6">
          <a href="#" id="send-code-link" style="display: none; font-size: 0.9rem;">Отправить код снова</a>
          <span id="code-error" style="color: red; font-size: 0.8rem; display: none;"></span>
        </div>
        <button class="btn-secondary" onclick="register()">Зарегистрироваться</button>
        <p style="margin-top: 12px;">
          <a href="#" onclick="guestLogin(); return false;">Войти как гость</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Соседик. Все права защищены.</p>
  </footer>

  <script src="js/header_new.js" defer></script>
  <script src="js/app.js"></script>
  <script>
    let registrationStep = 1;

    function guestLogin() {
      localStorage.removeItem('sosedik_token');
      window.location.href = '/';
    }

    // ---------- МАСКА ДЛЯ ТЕЛЕФОНА ----------
    function setupPhoneMask(inputElement, errorElement) {
      inputElement.addEventListener('input', function (e) {
        let rawValue = this.value.replace(/\D/g, '');   // только цифры

        // Если стёрли всё до кода страны – вернём код
        if (rawValue.length < 3) {
          rawValue = '375' + rawValue;
        }

        // Ограничение максимум 12 цифрами (375 + 9)
        rawValue = rawValue.substring(0, 12);

        // Форматирование
        let formatted = '+375';
        if (rawValue.length > 3) {
          formatted += ' (' + rawValue.substring(3, 5);
        }
        if (rawValue.length >= 6) {
          formatted += ') ' + rawValue.substring(5, 8);
        }
        if (rawValue.length >= 9) {
          formatted += '-' + rawValue.substring(8, 10);
        }
        if (rawValue.length >= 11) {
          formatted += '-' + rawValue.substring(10, 12);
        }

        this.value = formatted;
        // Ставим курсор в конец (упрощение)
        this.setSelectionRange(formatted.length, formatted.length);

        // Сразу проверяем и показываем ошибку, если номер полный
        if (rawValue.length === 12) {
          const validation = validatePhone(rawValue);
          if (!validation.valid) {
            errorElement.textContent = validation.error;
            errorElement.style.display = 'block';
          } else {
            errorElement.textContent = '';
            errorElement.style.display = 'none';
          }
        } else {
          errorElement.textContent = '';
          errorElement.style.display = 'none';
        }
      });

      // При потере фокуса – если номер не до конца введён, показываем подсказку
      inputElement.addEventListener('blur', function () {
        const digits = this.value.replace(/\D/g, '');
        if (digits.length > 0 && digits.length < 12) {
          errorElement.textContent = 'Введите номер полностью';
          errorElement.style.display = 'block';
        }
      });
    }

    // ---------- ВАЛИДАЦИЯ НОМЕРА ----------
    function validatePhone(digitsOnly) {
      // digitsOnly – строка из 12 цифр (например, '375251234567')
      if (!digitsOnly || digitsOnly.length !== 12) {
        return { valid: false, error: 'Номер должен содержать 12 цифр (+375 и 9 цифр номера)' };
      }
      if (!digitsOnly.startsWith('375')) {
        return { valid: false, error: 'Номер должен начинаться с +375' };
      }

      const operatorCode = digitsOnly.substring(3, 5);
      const allowedOperators = ['25', '29', '33', '44'];
      if (!allowedOperators.includes(operatorCode)) {
        return { valid: false, error: 'Неверный код оператора. Допустимые: 25, 29, 33, 44' };
      }

      const firstDigit = digitsOnly.charAt(5); // первая цифра после кода оператора
      if (firstDigit === '0') {
        return { valid: false, error: 'Первая цифра номера не может быть 0' };
      }

      // Дополнительно: все оставшиеся символы – цифры (уже гарантировано)
      const rest = digitsOnly.substring(5); // 7 цифр
      if (!/^\d{7}$/.test(rest)) {
        return { valid: false, error: 'Некорректный номер' };
      }

      return { valid: true };
    }

    // ---------- ФУНКЦИИ ВХОДА / РЕГИСТРАЦИИ (ОБНОВЛЁННЫЕ) ----------

    // Проверка телефона перед отправкой
    function getValidPhone(inputId, errorId) {
      const input = document.getElementById(inputId);
      const errorEl = document.getElementById(errorId);
      const raw = input.value.replace(/\D/g, '');
      const validation = validatePhone(raw);

      if (!validation.valid) {
        errorEl.textContent = validation.error;
        errorEl.style.display = 'block';
        return null;
      }
      errorEl.textContent = '';
      errorEl.style.display = 'none';
      return raw; // 12 цифр
    }

    async function login() {
      const phone = getValidPhone('login-phone', 'login-phone-error');
      if (!phone) return;

      const password = document.getElementById('login-password').value;
      const passwordError = document.getElementById('login-password-error');
      const phoneError = document.getElementById('login-phone-error');

      // Сброс предыдущих ошибок
      phoneError.style.display = 'none';
      passwordError.style.display = 'none';

      if (!password) {
        passwordError.textContent = 'Введите пароль';
        passwordError.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: '+' + phone, password })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('sosedik_token', data.token);
          window.location.href = '/';
        } else {
          // Определяем, к какому полю относится ошибка
          const msg = data.message || 'Ошибка входа';
          if (msg.includes('номер') || msg.includes('телефон') || msg.includes('пользователь с таким')) {
            phoneError.textContent = msg;
            phoneError.style.display = 'block';
          } else {
            passwordError.textContent = msg;
            passwordError.style.display = 'block';
          }
        }
      } catch (error) {
        passwordError.textContent = 'Ошибка сети';
        passwordError.style.display = 'block';
      }
    }

    async function register() {
      // Первый шаг: проверка телефона и пароля
      if (registrationStep === 1) {
        const phone = getValidPhone('register-phone', 'register-phone-error');
        if (!phone) return;

        const password = document.getElementById('register-password').value;
        if (!password) {
          alert('Введите пароль');
          return;
        }

        try {
          const resp = await fetch('/api/auth/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: '+' + phone })
          });
          const data = await resp.json();

          if (resp.ok) {
            // Очищаем возможную предыдущую ошибку
            document.getElementById('register-phone-error').textContent = '';
            document.getElementById('register-phone-error').style.display = 'none';

            alert('Код отправлен (демо): ' + data.code);

            const registerBtn = document.querySelector('#register-password').closest('.form-container').querySelector('button.btn-secondary');
            registerBtn.textContent = 'Подтвердить';

            document.getElementById('code-section').style.display = 'block';
            document.getElementById('code-hint').textContent = 'На указанный номер отправлен код подтверждения. Введите его в поле.';
            document.getElementById('register-phone').disabled = true;
            document.getElementById('register-password').disabled = true;
            document.getElementById('send-code-link').style.display = 'none';
            document.getElementById('code-error').style.display = 'none';
            registrationStep = 2;
          } else {
            // Показываем ошибку под полем телефона
            document.getElementById('register-phone-error').textContent = data.message;
            document.getElementById('register-phone-error').style.display = 'block';

            // Разблокируем поля для исправления
            document.getElementById('register-phone').disabled = false;
            document.getElementById('register-password').disabled = false;

            // Возвращаем кнопку в исходное состояние
            const registerBtn = document.querySelector('#register-password').closest('.form-container').querySelector('button.btn-secondary');
            registerBtn.textContent = 'Зарегистрироваться';
            registrationStep = 1;
          }
        } catch (e) {
          document.getElementById('register-phone-error').textContent = 'Ошибка сети при отправке кода';
          document.getElementById('register-phone-error').style.display = 'block';

          document.getElementById('register-phone').disabled = false;
          document.getElementById('register-password').disabled = false;

          const registerBtn = document.querySelector('#register-password').closest('.form-container').querySelector('button.btn-secondary');
          registerBtn.textContent = 'Зарегистрироваться';
          registrationStep = 1;
        }
        return;
      }

      // Второй шаг: проверка кода
      const codeInput = document.getElementById('register-code');
      const code = codeInput.value.trim();
      if (!code) {
        document.getElementById('code-error').textContent = 'Введите код подтверждения';
        document.getElementById('code-error').style.display = 'block';
        return;
      }
      // Скрываем ошибку, если поле заполнено
      document.getElementById('code-error').style.display = 'none';

      try {
        const phone = document.getElementById('register-phone').value.replace(/\D/g, '');
        const password = document.getElementById('register-password').value;
        const response = await fetch('/api/auth/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: '+' + phone, password, code })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('sosedik_token', data.token);
          window.location.href = '/';
        } else {
          document.getElementById('code-error').textContent = data.message;
          document.getElementById('code-error').style.display = 'block';
          document.getElementById('send-code-link').style.display = 'inline';
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    // Остальная логика (guestLogin, повторная отправка кода) остаётся без изменений
    // ...

    // Привязка масок после загрузки DOM
    document.addEventListener('DOMContentLoaded', function () {
      const loginPhone = document.getElementById('login-phone');
      const loginPhoneError = document.getElementById('login-phone-error');
      const registerPhone = document.getElementById('register-phone');
      const registerPhoneError = document.getElementById('register-phone-error');

      if (loginPhone) setupPhoneMask(loginPhone, loginPhoneError);
      if (registerPhone) setupPhoneMask(registerPhone, registerPhoneError);

      // Старый код для ссылки "Отправить код снова"
      document.getElementById('send-code-link').addEventListener('click', async (e) => {
        e.preventDefault();
        const phoneDigits = document.getElementById('register-phone').value.replace(/\D/g, '');
        if (!validatePhone(phoneDigits).valid) {
          alert('Введите корректный номер телефона');
          return;
        }
        try {
          const resp = await fetch('/api/auth/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: '+' + phoneDigits })
          });
          const data = await resp.json();
          if (resp.ok) {
            alert('Код отправлен (демо): ' + data.code);
            document.getElementById('code-error').style.display = 'none';
            document.getElementById('send-code-link').style.display = 'none';
          } else {
            document.getElementById('code-error').textContent = data.message;
            document.getElementById('code-error').style.display = 'block';
          }
        } catch (e) {
          alert('Ошибка сети');
        }
      });
    });
  </script>
</body>

</html>
